<body>
    <header class="shell"><a href="cpp.html">← Back to C++ projects</a><strong>C++ COLLECTION</strong></header>
    <main class="shell">
        <div class="eyebrow">C++ project · C++17</div>
        <h1>Circle Class</h1>
        <p>Use a C++ class to calculate the area and circumference of circles from their radius.</p>
        <section class="panel">
            <div class="panel-head"><strong>circle-class.cpp</strong><span>C++17</span></div>
            <textarea class="code" spellcheck="false">#include &lt;iostream&gt;
using namespace std;

class Circle {
private:
    float radius;
public:
    Circle(float _radius) { radius = _radius; }
    void setRadius(float _radius) { radius = _radius; }
    float getRadius() { return radius; }
    float getArea() { return 3.14159f * radius * radius; }
    float getCircumference() { return 2 * 3.14159f * radius; }
};

int main() {
    Circle circle1(5.0f);
    Circle circle2(7.5f);

    cout &lt;&lt; "Circle 1 - Radius: " &lt;&lt; circle1.getRadius() &lt;&lt; endl;
    cout &lt;&lt; "Circle 1 - Area: " &lt;&lt; circle1.getArea() &lt;&lt; endl;
    cout &lt;&lt; "Circle 1 - Circumference: " &lt;&lt; circle1.getCircumference() &lt;&lt; endl;
    cout &lt;&lt; "Circle 2 - Radius: " &lt;&lt; circle2.getRadius() &lt;&lt; endl;
    cout &lt;&lt; "Circle 2 - Area: " &lt;&lt; circle2.getArea() &lt;&lt; endl;
    cout &lt;&lt; "Circle 2 - Circumference: " &lt;&lt; circle2.getCircumference() &lt;&lt; endl;
    return 0;
}</textarea>
            <div class="controls"><span>Run the program to view the circle calculations.</span><button id="run" type="button">Run C++</button></div>
            <pre id="output">Click Run C++ to start the program.</pre>
        </section>
    </main>

        document.querySelector('#run').addEventListener('click', () => { document.querySelector('#output').textContent = circleOutput; });
    </script>
