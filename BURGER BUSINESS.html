<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURGERLICIOUS PRESTIGE v30.16 | THE ULTIMATE MONOLITH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23ff8c00'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif'%3E%F0%9F%8D%94%3C/text%3E%3C/svg%3E">
    
    <style>
        :root {
            --primary: #FF8C00;
            --primary-glow: rgba(255, 140, 0, 0.3);
            --bg: #020202;
            --panel: #0a0a0a;
            --card: #121212;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #777;
            --success: #00ffa3;
            --danger: #ff3e3e;
            --warning: #ffcc00;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            background-image: radial-gradient(circle at 50% -20%, #1a1a1a, #020202);
        }
        .overlay, .auth-card, .btn-glam { pointer-events: auto !important; }

        .hidden { display: none !important; }

        /* SCROLLBAR CUSTOMIZATION */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* UNIVERSAL COMPONENTS */
        button { cursor: pointer; border: none; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); outline: none; border-radius: 16px; }
        
        input, select, textarea { 
            outline: none; border: 1px solid var(--border); background: rgba(0,0,0,0.4); 
            color: #fff; border-radius: 16px; padding: 18px; width: 100%; 
            font-size: 1rem; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); background: #000; }

        .btn-glam { 
            background: var(--card); border: 1px solid var(--border); color: #fff; 
            padding: 10px 20px; font-weight: 700; display: flex; align-items: center; 
            justify-content: center; gap: 12px; letter-spacing: 0.5px;
        }
        .btn-glam:hover { border-color: var(--primary); transform: translateY(-3px); background: #1a1a1a; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .btn-glam.active { background: var(--primary); color: #000; border-color: transparent; box-shadow: 0 15px 30px var(--primary-glow); }
        .btn-success { background: #00ffa3; color: #000; border-color: transparent; }
        .btn-success:hover { background: #00d88e; }
        .btn-danger { background: rgba(255, 62, 62, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        @page { size: 80mm auto; margin: 5mm; }
        @media print {
            html, body { width: auto; height: auto; margin: 0; padding: 0; overflow: visible; }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { position: relative !important; left: 0 !important; top: 0 !important; width: auto !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
            #printable-area .receipt-paper,
            #printable-area .z-report-paper { width: 80mm !important; max-width: 80mm !important; margin: 0 auto !important; box-shadow: none !important; border: none !important; }
            #printable-area table { page-break-inside: avoid !important; }
            #printable-area tr, #printable-area p, #printable-area div { page-break-inside: avoid !important; page-break-after: auto !important; }
        }

        /* AUTHENTICATION LAYER */
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 99999; 
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(40px); 
        }
        .auth-card { 
            background: var(--panel); border: 1px solid var(--border); border-radius: 50px; 
            padding: 60px; width: 550px; text-align: center; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        /* HEADER ARCHITECTURE */
        header { 
            height: 100px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; padding: 0 50px;
            backdrop-filter: blur(20px);
        }
        .logo-text { font-weight: 900; font-size: 2rem; letter-spacing: -2px; }
        .logo-text span { color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }

        /* POS ENGINE LAYOUT */
        .main-engine { display: grid; grid-template-columns: 1fr 450px; height: calc(100vh - 100px); }
        
        .menu-view { overflow-y: auto; padding: 50px; background: transparent; }
        .category-stripe { 
            border-left: 8px solid var(--primary); padding-left: 25px; margin: 50px 0 30px 0; 
            font-size: 1.6rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px;
        }
        
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .item-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 30px; 
            padding: 15px; text-align: center; cursor: pointer; transition: 0.5s; position: relative; 
            overflow: hidden;
        }
        .item-card:hover { border-color: var(--primary); transform: translateY(-5px) scale(1.01); }
        .item-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 20px; margin-bottom: 15px; }
        .item-card b { font-size: 1rem; display: block; margin-bottom: 5px; }
        .item-card span { font-weight: 800; color: var(--primary); font-size: 1.2rem; font-family: 'JetBrains Mono'; }
        .best-seller-badge { position: absolute; top: 10px; right: 10px; background: var(--success); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
        .item-card.oos { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        /* CART SIDEBAR */
        .cart-sidebar { 
            background: rgba(8, 8, 8, 0.95); border-left: 1px solid var(--border); 
            display: flex; flex-direction: column; padding: 18px 18px 16px; backdrop-filter: blur(26px);
            width: 100%; max-width: 450px; min-width: 320px; min-height: 0; gap: 0;
        }
        .cart-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 0; margin-bottom: 14px; }
        .cart-item { 
            background: var(--card); padding: 10px 12px; border-radius: 18px; margin-bottom: 6px; 
            border: 1px solid var(--border); position: relative; animation: slideIn 0.35s ease-out; 
        }
        .cart-item b { display: block; font-size: 0.92rem; line-height: 1.2; margin-bottom: 3px; }
        .cart-item small { display: block; line-height: 1.25; margin-top: 3px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(25px); } to { opacity: 1; transform: translateX(0); } }
        
        .cart-total-box { 
            background: #000; padding: 16px; border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); position: sticky; bottom: 0; z-index: 2;
        }
        .cart-total-box > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
        .cart-total-box button { width: 100%; height: 64px; font-size: 1.5rem; border-radius: 20px; }

        /* ADMIN SYSTEM */
        #admin-panel {             position: fixed; inset: 0; background: var(--bg); z-index: 80000; 
            display: none; grid-template-columns: 350px 1fr; 
        }
        .admin-nav { 
            background: #000; border-right: 1px solid var(--border); padding: 40px 20px; 
            display: flex; flex-direction: column; gap: 10px; width: 260px;
        }
        .admin-nav .btn-glam { padding: 8px 12px; font-size: 0.85rem; text-align: left; }
        .admin-nav .btn-glam i { margin-right: 6px; }
        .admin-body { padding: 60px; overflow-y: auto; }

        /* LIST VIEW MENU MANAGER (Requested) */
        .menu-list-row {
            background: var(--card); padding: 12px 20px; border-radius: 15px; 
            border: 1px solid var(--border); display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 10px; transition: 0.3s;
        }
        .menu-list-row:hover { border-color: var(--primary); background: #181818; }

        /* TABLES */
        .titan-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .titan-table th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
        .titan-table tr td { background: var(--card); padding: 10px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .titan-table tr td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
        .titan-table tr td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
        .low-stock-badge { color: #ff6154; font-weight: 700; font-size: 0.8rem; margin-left: 10px; }

        /* MODAL ARCHITECTURE */
        .modal-box { 
            background: var(--panel); border: 2px solid var(--primary); border-radius: 55px; 
            padding: 40px 40px 28px; width: 700px; max-height: 90vh; overflow-y: auto; position: relative; 
            box-shadow: 0 0 120px rgba(255, 140, 0, 0.2); 
        }
        .scroll-list { background: rgba(0,0,0,0.5); border-radius: 35px; padding: 20px 20px 80px; border: 1px solid var(--border); margin: 15px 0 20px; overflow-y: auto; }
        
        /* Z-REPORT STYLING (Requested) */
        .z-report-paper { 
            background: #fff; color: #000; padding: 28px; font-family: 'Courier New', Courier, monospace; 
            width: 100%; max-width: 900px; margin: 0 auto; line-height: 1.5; font-size: 14px; 
            box-shadow: 0 16px 45px rgba(0,0,0,0.18);
            border-radius: 22px;
        }
        .z-report-paper h2 { margin-bottom: 12px; }
        .report-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 16px; }
        .report-card { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; padding: 14px 16px; }
        .report-card strong { display: block; margin-bottom: 8px; font-size: 0.95rem; }
        .report-section-title { margin-top: 24px; margin-bottom: 10px; font-size: 0.98rem; letter-spacing: 1px; text-transform: uppercase; }
        .report-detail { margin-bottom: 8px; }
        .report-detail small { color: #444; }
        .report-grid { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: 14px; }
        .report-list { list-style: none; margin: 0; padding: 0; }
        .report-list li { padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.08); }
        .report-list li:last-child { border-bottom: none; }
        .report-list strong { display: inline-block; width: 45%; color: #000; }
        .report-list span { color: #333; }
        .hr-dots { border: none; border-top: 1px dotted rgba(0,0,0,0.45); margin: 16px 0; }

        /* RECEIPT STYLING */
        .receipt-paper {
            background: #fff; color: #000; padding: 16px 14px; font-family: 'Courier New', Courier, monospace;
            width: 80mm; max-width: 80mm; margin: 0 auto; line-height: 1.35; font-size: 12px;
            border: none; box-shadow: none;
            text-align: left;
        }
        .receipt-paper hr { border: none; border-top: 1px dashed #000; margin: 10px 0; }

        @media (max-width: 900px) {
            body { height: auto; min-height: 100vh; overflow: auto; }
            .auth-card { width: min(550px, calc(100% - 32px)); padding: 36px 24px; border-radius: 28px; }
            .auth-card .logo-text { font-size: clamp(1.8rem, 9vw, 2.5rem); }
            .auth-card p { margin-bottom: 28px !important; letter-spacing: 2px !important; }
            #pos-shell { min-height: 100vh; }
            header { height: auto; min-height: 84px; padding: 16px 20px; flex-wrap: wrap; }
            header > div { flex: 1 1 180px; }
            header > div:last-child { flex-basis: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .logo-text { font-size: 1.45rem; }
            #clock { font-size: 1.15rem !important; padding: 9px 14px !important; }
            .main-engine { display: flex; flex-direction: column; height: auto; min-height: calc(100vh - 84px); }
            .menu-view { padding: 28px 18px; overflow: visible; }
            .cart-sidebar { max-width: none; min-width: 0; min-height: 360px; border-left: 0; border-top: 1px solid var(--border); }
            .admin-body { padding: 28px 18px; }
            #admin-panel { display: none; grid-template-columns: 1fr; overflow-y: auto; }
            .admin-nav { width: 100%; padding: 24px 18px; border-right: 0; border-bottom: 1px solid var(--border); }
            .admin-nav h2 { margin-bottom: 20px !important; }
            .modal-box { width: min(700px, calc(100% - 24px)); padding: 28px 18px 22px; border-radius: 28px; }
            .scroll-list { padding: 14px 12px 30px; border-radius: 20px; }
            .titan-table { display: block; overflow-x: auto; white-space: nowrap; }
        }

        @media (max-width: 520px) {
            .items-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .item-card { padding: 10px; border-radius: 20px; }
            .item-card img { height: 90px; border-radius: 14px; margin-bottom: 10px; }
            .item-card b { font-size: .82rem; }
            .item-card span { font-size: 1rem; }
            .category-stripe { margin: 30px 0 18px; padding-left: 14px; border-left-width: 5px; font-size: 1.15rem; }
            .menu-view > div:first-child { margin-bottom: 24px !important; }
            .menu-view > div:first-child .btn-glam { flex: 0 0 auto; min-height: 42px; padding: 9px 12px; font-size: .72rem; }
            .cart-total-box > div { align-items: flex-start; flex-direction: column; gap: 4px; }
            .cart-total-box h2 { font-size: 2.1rem !important; }
            .report-grid { grid-template-columns: 1fr; }
            .report-summary { grid-template-columns: 1fr; }
            #pin-pad-modal > div { width: calc(100% - 24px) !important; padding: 24px !important; }
        }
    </style>
</head>
<body>

    <div id="auth-layer" class="overlay">
        <div id="debug-badge" style="position:fixed; top:12px; right:12px; z-index:100000; color:#fff; background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.1); padding:8px 12px; border-radius:999px; font-size:0.8rem;">AUTH STATUS</div>
        <div class="auth-card">
            <h1 class="logo-text">BURGER<span>LICIOUS</span></h1>
            <p style="color:var(--text-dim); margin-bottom:45px; font-weight:800; font-size:0.9rem; letter-spacing:4px; text-transform:uppercase;">pls input the following before accessing.</p>
            <input id="log-cashier" placeholder="CASHIER NAME" style="margin-bottom:18px;">
            <input id="log-email" placeholder="ADMIN EMAIL" style="margin-bottom:18px;">
            <input id="log-pass" type="password" placeholder="PASSWORD" style="margin-bottom:35px;">
            <button id="login-btn" type="button" class="btn-glam active" style="width:100%; height:75px; font-size:1.1rem; margin-bottom:20px;" onclick="window.burgerliciousLogin()">LOG IN</button>
            <button id="signup-btn" type="button" class="btn-glam" style="width:100%; height:60px; font-size:1rem;" onclick="window.openModal('ADMIN_SIGNUP')">SIGN UP</button>
        </div>
    </div>

    <div id="pos-shell" class="hidden">
        <header style="display:flex; align-items:center; justify-content:space-between; gap:20px;">
            <div class="logo-text">BURGER<span>LICIOUS</span></div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
                <div id="clock" style="font-family:'JetBrains Mono'; font-weight:800; color:var(--primary); font-size:1.8rem; background:rgba(255,255,255,0.05); padding:12px 35px; border-radius:20px; border:1px solid var(--border);">00:00:00</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px;">
                <div id="cashier-display" onclick="ui.editCashier()" style="cursor:pointer; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; padding:8px 15px; color:#fff; text-align:right; font-weight:600; min-width:180px;">CASHIER NAME</div>
                <div id="cashier-edit" style="display:none; gap:5px; align-items:center;">
                    <input id="cashier-input" placeholder="CASHIER NAME" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; padding:5px 10px; color:#fff; text-align:left; font-weight:600; min-width:180px;" />
                    <div style="display:flex; gap:5px;">
                        <button class="btn-glam" style="padding:5px 10px; font-size:0.8rem;" onclick="ui.saveCashier()">SAVE</button>
                        <button class="btn-glam btn-danger" style="padding:5px 10px; font-size:0.8rem;" onclick="ui.cancelCashier()">CANCEL</button>
                    </div>
                </div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button id="open-shift-btn" class="btn-glam" onclick="ui.openShift()">OPEN SHIFT</button>
                <button id="close-shift-btn" class="btn-glam btn-danger" onclick="ui.closeShift()">CLOSE SHIFT</button>
                <button class="btn-glam" onclick="admin.requestAccess()"><i class="fas fa-shield-halved"></i> ADMIN</button>
                <button class="btn-glam btn-danger" onclick="location.reload()"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <main class="main-engine">
            <section class="menu-view">
                <div style="display:flex; gap:10px; margin-bottom:45px; overflow-x:auto; padding-bottom:15px;">
                    <button class="btn-glam active" onclick="pos.renderMenu('all', this)">ALL CATEGORIES</button>
                    <button class="btn-glam" onclick="pos.renderMenu('burgers', this)">BURGERS</button>
                    <button class="btn-glam" onclick="pos.renderMenu('budget', this)">BUDGET MEALS</button>
                    <button class="btn-glam" onclick="pos.renderMenu('combo', this)">COMBO MEALS</button>
                    <button class="btn-glam" onclick="pos.renderMenu('sides', this)">SIDES & SNACKS</button>
                    <button class="btn-glam" onclick="pos.renderMenu('drinks', this)">DRINKS</button>
                    <button class="btn-glam" onclick="pos.renderMenu('b1t1', this)">🎉 BUY 1 TAKE 1</button>
                </div>
                <div id="menu-container"></div>
            </section>

            <section class="cart-sidebar">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
                    <h3 style="color:var(--primary); letter-spacing:2px; font-weight:900; margin:0;">ACTIVE CART</h3>
                    <button class="btn-danger" style="padding:10px 18px; font-size:0.8rem; min-height:44px;">RESET</button>
                </div>
                <div id="cart-root" class="cart-list"></div>
                <div class="cart-total-box">
                    <div>
                        <span style="font-weight:800; color:var(--text-dim); font-size:1rem;">TOTAL AMOUNT</span>
                        <h2 id="total-ui" style="color:var(--primary); font-size:2.8rem; font-family:'JetBrains Mono'; margin:0;">₱0.00</h2>
                    </div>
                    <button class="btn-glam active" onclick="pos.checkout()">CHECKOUT</button>
                </div>
            </section>
        </main>
    </div>

    <div id="admin-panel">
        <aside class="admin-nav">
            <h2 class="logo-text" style="margin-bottom:50px;">BURGER<span>LICIOUS</span></h2>
            <button class="btn-glam active" onclick="admin.nav('dash', this)"><i class="fas fa-chart-line"></i> DASHBOARD</button>
            <button class="btn-glam" onclick="admin.nav('inv', this)"><i class="fas fa-boxes-stacked"></i> INVENTORY</button>
            <button class="btn-glam" onclick="admin.nav('menu', this)"><i class="fas fa-list-ul"></i> MENU MANAGER</button>
            <button class="btn-glam" onclick="admin.nav('mod', this)"><i class="fas fa-sliders"></i> MODIFIER ENGINE</button>
            <button class="btn-glam" onclick="admin.nav('sales', this)"><i class="fas fa-history"></i> SALES LOGS</button>
            <button class="btn-glam" style="background:#1a1a1a; margin-top:20px;" onclick="ui.openModal('Z_REPORT')"><i class="fas fa-file-invoice-dollar"></i> Z-RECORD</button>
            <button class="btn-glam" style="background:#1a1a1a;" onclick="ui.openModal('WEEKLY_REPORT')"><i class="fas fa-calendar-week"></i> WEEKLY REPORT</button>
            <button class="btn-glam" style="background:#1a1a1a; margin-bottom:20px;" onclick="ui.openModal('MONTHLY_REPORT')"><i class="fas fa-calendar"></i> MONTHLY REPORT</button>
            <button class="btn-glam btn-danger" style="margin-top:auto;" onclick="admin.close()">BACK TO POS</button>
        </aside>
        <main class="admin-body" id="admin-root"></main>
    </div>

    <div id="modal-layer" class="overlay hidden">
        <div class="modal-box" id="modal-content"></div>
    </div>

    <div id="pin-pad-modal" class="overlay hidden">
        <div style="background: var(--panel); border: 3px solid var(--primary); padding: 40px; width: 400px; text-align: center;">
            <h2 style="color: var(--primary); font-size: 1.5rem; margin-bottom: 20px;">ADMIN PIN</h2>
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 30px;">
                <div id="pin-dot-0" style="width: 40px; height: 40px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-dim); transition: 0.2s;">●</div>
                <div id="pin-dot-1" style="width: 40px; height: 40px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-dim); transition: 0.2s;">●</div>
                <div id="pin-dot-2" style="width: 40px; height: 40px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-dim); transition: 0.2s;">●</div>
                <div id="pin-dot-3" style="width: 40px; height: 40px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-dim); transition: 0.2s;">●</div>
            </div>

    <script>
        window.loginFallback = window.loginFallback || function() {
            alert('Login handler is not available. Please refresh the page.');
        };
        window.modalFallback = window.modalFallback || function(type) {
            alert('Signup handler is not available. Please refresh the page.');
        };
        const firebaseConfig = {
            apiKey: "AIzaSyDr-qSCLOfMtDY4sayq6aqiTTIezqkeLFg",
            authDomain: "burgersystem-3b546.firebaseapp.com",
            databaseURL: "https://burgersystem-3b546-default-rtdb.asia-southeast1.firebasedatabase.app",

            appId: "1:304703590969:web:054d4f984b7ab720fdb3e8",

        }

        var core = window.core = {};
        var ui = window.ui = {};
        var admin = window.admin = {};
        var pos = window.pos = {};

        window.openModal = function(type, data) {
            if (window.ui && typeof window.ui.openModal === 'function') {
                return window.ui.openModal(type, data);
            }
            return window.modalFallback(type);

        window.closeModal = function() {
            if (window.ui && typeof window.ui.closeModal === 'function') {
                return window.ui.closeModal();

        window.burgerliciousOpenSignup = function() {
            var content = document.getElementById('modal-content');
            if (!content) return alert('Modal content not found.');
            document.getElementById('modal-layer')?.classList.remove('hidden');
            content.innerHTML = '<h2>CREATE ADMIN ACCOUNT</h2><br /><input id="signup-email" placeholder="ADMIN EMAIL" style="margin-bottom:18px;" /><br /><input id="signup-pass" type="password" placeholder="PASSWORD" style="margin-bottom:18px;" /><br /><input id="signup-pin" type="password" placeholder="PIN (4 digits)" style="margin-bottom:35px;" /><br /><button class="btn-glam active" style="width:100%" onclick="window.burgerliciousCreateAdminAccount()">CREATE ACCOUNT</button><button class="btn-glam" style="width:100%; margin-top:20px;" onclick="window.burgerliciousCloseModal()">BACK</button>';
        };

        window.burgerliciousCreateAdminAccount = function() {
            if (!window.db) return alert('Firebase database not available.');
            var rawEmail = document.getElementById('signup-email').value.trim().toLowerCase();
            var pass = document.getElementById('signup-pass').value;
            var pin = document.getElementById('signup-pin').value;
            if (!rawEmail || !pass || !pin) return alert('ALL FIELDS REQUIRED');
            if (pin.length !== 4) return alert('PIN MUST BE 4 DIGITS');
            var emailKey = rawEmail.replace(/\./g, '_');
            window.db.ref('admins/' + emailKey).set({ email: rawEmail, pass: pass, pin: pin, createdAt: Date.now() })
                .then(function() {
                    alert('ADMIN ACCOUNT CREATED');
                    window.logActivity('CREATE_ADMIN', { email: rawEmail });
                    window.burgerliciousCloseModal();
                })
                .catch(function(err) {
                    console.error(err);
                    alert('Unable to create account.');
                });
        };
        window.ui.createAdminAccount = window.burgerliciousCreateAdminAccount;

        window.burgerliciousLogin = function() {
            if (!window.db) return alert('Firebase database not available.');
            var rawEmail = document.getElementById('log-email').value.trim().toLowerCase();
            var emailKey = rawEmail.replace(/\./g, '_');
            var pass = document.getElementById('log-pass').value;
            var cashier = document.getElementById('log-cashier').value.trim();
            if (!cashier || !rawEmail || !pass) return alert('ALL FIELDS REQUIRED');
            var loginSuccess = function(data) {
                user.admin = data || null;
                user.cashier = cashier;
                document.getElementById('auth-layer').classList.add('hidden');
                document.getElementById('pos-shell').classList.remove('hidden');
                document.getElementById('cashier-display').innerText = cashier;
                if (typeof window.core.sync === 'function') {
                    window.core.sync();
                }
            };
            window.db.ref('admins/' + emailKey).once('value', function(snapshot) {
                var d = snapshot.val();
                if (d && d.pass === pass) {
                    loginSuccess(d);
                    window.logActivity('LOGIN_SUCCESS', { cashier: cashier, email: rawEmail });
                } else {
                    alert('INVALID CREDENTIALS');
                }
            });
        };

        // Error and logging handlers
        window.addEventListener('error', (event) => {
            console.error('App error:', event.message, event.filename, event.lineno, event.colno);
            const badge = document.getElementById('debug-badge');
            if (badge) badge.innerText = 'ERROR';
        });
        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled rejection:', event.reason);
            const badge = document.getElementById('debug-badge');
            if (badge) badge.innerText = 'ERROR';
        });

        // INITIALIZATION
        let state = { inventory: {}, products: {}, orders: {}, modifiers: {}, cart: [], activeFilter: 'all', stock_logs: {}, shifts: {}, weeklyReports: {}, monthlyReports: {}, currentWeekStart: null, currentWeekStartTs: null, currentMonthStart: null };
        let user = { admin: null, cashier: "" };
        let pinStr = "";

        const normalizeRecipe = (recipe) => {
            if (!recipe) return [];
            if (Array.isArray(recipe)) {
                return recipe.filter(Boolean).map(r => ({ id: String(r.id), amt: parseFloat(r.amt) || 0 }));
            }
            if (typeof recipe === 'object') {
                return Object.entries(recipe)
                    .filter(([key, value]) => value !== undefined && value !== null)
                    .map(([key, value]) => {
                        if (value && typeof value === 'object' && ('id' in value || 'amt' in value)) {
                            return { id: String(value.id || key), amt: parseFloat(value.amt) || 0 };
                        }
                        return { id: String(key), amt: parseFloat(value) || 0 };
                    });
            }
            return [];
        };
        const normalizeProducts = (products) => {
            if (!products) return {};
            return Object.fromEntries(Object.entries(products).map(([id, p]) => [id, { ...p, recipe: normalizeRecipe(p.recipe) }]));
        };
        const normalizeModifiers = (modifiers) => {
            if (!modifiers) return {};
            return Object.fromEntries(Object.entries(modifiers).map(([id, m]) => [id, { id, ...m, recipe: normalizeRecipe(m.recipe) }]));
        };
        const normalizeInventory = (inventory) => {
            if (!inventory) return {};
            return Object.fromEntries(Object.entries(inventory).map(([id, item]) => {
                return [id, {
                    ...item,
                    qty: parseFloat(item?.qty) || 0,
                    cost: parseFloat(item?.cost) || 0,
                    name: String(item?.name || ''),
                    category: String(item?.category || ''),
                    unit: String(item?.unit || '')
                }];
            }));
        };

        window.logActivity = function(action, details = {}) {
            const payload = {
                action,
                details,
                cashier: user.cashier || null,
                admin: user.admin?.email || null,
                timestamp: Date.now()
            };
            if (window.db) {
                db.ref('activity_logs').push(payload).catch(err => console.error('Activity log failed:', err));
            }
        };

        const parseCurrency = (value) => parseFloat(String(value).replace(/[^0-9.-]+/g, '')) || 0;
        const safeText = (value) => String(value || '').replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const getLocalDate = (timestamp) => {
            const d = new Date(timestamp);
            return d.toLocaleDateString('en-CA');
        };
        const getTimestamp = (value) => Number(value) || 0;
        const updateLocalInventoryQty = (id, qty) => {
            if (state.inventory[id]) {
                state.inventory[id].qty = qty;
                admin.render();
                pos.renderMenu(state.activeFilter);
            }
        };
        ui.syncInventoryFromDatabase = function() {
            if (!window.db) return Promise.reject(new Error('Database not initialized'));
            return db.ref('inventory').once('value').then(snapshot => {
                state.inventory = normalizeInventory(snapshot.val() || {});
                admin.render();
                pos.renderMenu(state.activeFilter);
            });
        };
        const isTodayLocal = (timestamp) => getLocalDate(timestamp) === getLocalDate(Date.now());
        const isSameLocalDate = (timestamp, date) => getLocalDate(timestamp) === getLocalDate(date);
        const getItemModPrice = (item) => {
            if (item?.mods && Array.isArray(item.mods)) {
                return item.mods.reduce((sum, m) => sum + (parseFloat(m.price) || 0), 0);
            }
            return parseFloat(item?.modPrice) || 0;
        };
        const getItemQty = (item) => parseInt(item?.qty, 10) || 1;
        const getItemLineTotal = (item) => {
            const basePrice = parseFloat(item?.price) || 0;
            const modPrice = getItemModPrice(item);
            const qty = getItemQty(item);
            return (basePrice + modPrice) * qty;
        };

        var core = window.core;
        let paymentsLoaded = false;
        core.sync = function() {
                if (!window.db) {
                    console.error('Database not initialized');
                    return alert('Firebase database not initialized. Please refresh the page.');
                }
                window.db.ref('inventory').on('value', s => { state.inventory = normalizeInventory(s.val() || {}); pos.renderMenu(state.activeFilter); admin.render(); });
                window.db.ref('products').on('value', s => { state.products = normalizeProducts(s.val() || {}); pos.renderMenu(state.activeFilter); admin.render(); });
                window.db.ref('orders').on('value', s => { state.orders = s.val() || {}; admin.render(); pos.renderMenu(state.activeFilter); });
                window.db.ref('modifiers').on('value', s => { state.modifiers = normalizeModifiers(s.val() || {}); admin.render(); });
                window.db.ref('stock_logs').on('value', s => { state.stock_logs = s.val() || {}; });
                window.db.ref('shifts').on('value', s => { state.shifts = s.val() || {}; admin.render(); ui.updateShiftStatus(); });
                window.db.ref('weeklyReports').on('value', s => { state.weeklyReports = s.val() || {}; admin.render(); });
                window.db.ref('monthlyReports').on('value', s => { state.monthlyReports = s.val() || {}; admin.render(); });
                window.db.ref('metaData').on('value', s => { const meta = s.val() || {}; state.currentWeekStart = meta.currentWeekStart; state.currentWeekStartTs = meta.currentWeekStartTs || null; state.currentMonthStart = meta.currentMonthStart; admin.render(); ui.updateShiftStatus(); });
                window.db.ref('payments').once('value').then(() => { paymentsLoaded = true; });
                window.db.ref('payments').on('child_added', s => {
                    if (!paymentsLoaded) return;
                    const p = s.val();
                    if (p.cashier === user.cashier) {
                        alert(`GCash Payment Received: ₱${p.amount.toFixed(2)}`);
                    }
                });
                setInterval(() => { const clk = document.getElementById('clock'); if (clk) clk.innerText = new Date().toLocaleTimeString(); }, 1000);
                setTimeout(ui.updateShiftStatus, 500);
        };

        ui.getActiveShift = function() {
            return Object.entries(state.shifts || {}).map(([id, s]) => ({ id, ...s })).find(s => s.status === 'open');
        };

        ui.getLatestShiftToday = function() {
            const todayKey = getLocalDate(Date.now());
            const allShifts = Object.entries(state.shifts || {}).map(([id, s]) => ({ id, ...s }));
            const todayOpenShift = allShifts.find(s => s.status === 'open' && s.date === todayKey);
            if (todayOpenShift) return todayOpenShift;
            return allShifts.filter(s => s.date === todayKey).sort((a, b) => (b.startTime || 0) - (a.startTime || 0))[0];
        };

        ui.getWeekStart = function(date = new Date()) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const weekStart = new Date(d.setDate(diff));
            return weekStart.toISOString().slice(0, 10);
        };

        ui.getCurrentWeekStart = function() {
            return state.currentWeekStart || null;
        };

        ui.getCurrentWeekStartTs = function() {
            return state.currentWeekStartTs || null;
        };

        ui.getLatestCompletedWeeklyReport = function() {
            const reports = Object.values(state.weeklyReports || {});
            if (!reports.length) return null;
            return reports.sort((a, b) => getTimestamp(b.weekStartTs || b.createdAt) - getTimestamp(a.weekStartTs || a.createdAt))[0];
        };

        ui.getReportWeekStart = function() {
            if (state.currentWeekStart) return state.currentWeekStart;
            const latest = ui.getLatestCompletedWeeklyReport();
            return latest ? latest.weekStart : ui.getWeekStart();
        };

        ui.getReportWeekEnd = function() {
            const latest = ui.getLatestCompletedWeeklyReport();
            if (state.currentWeekStart) {
                const d = new Date(ui.getReportWeekStart());
                d.setDate(d.getDate() + 6);
                return d.toISOString().slice(0, 10);
            }
            return latest ? latest.weekEnd : (() => { const d = new Date(ui.getReportWeekStart()); d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10); })();
        };

        ui.getCurrentWeeklyRange = function() {
            const activeStartTs = getTimestamp(ui.getCurrentWeekStartTs());
            const latest = ui.getLatestCompletedWeeklyReport();
            if (activeStartTs) {
                const displayedStart = state.currentWeekStart || getLocalDate(activeStartTs);
                const displayEnd = new Date(displayedStart);
                displayEnd.setDate(displayEnd.getDate() + 6);
                return {
                    isActive: true,
                    activeStartTs,
                    weekStart: displayedStart,
                    weekEnd: displayEnd.toISOString().slice(0, 10),
                    dateFilter: o => getTimestamp(o.timestamp) >= activeStartTs && getTimestamp(o.timestamp) <= displayEnd.getTime()
                };
            }
            if (latest) {
                return {
                    isActive: false,
                    activeStartTs: null,
                    weekStart: latest.weekStart,
                    weekEnd: latest.weekEnd,
                    dateFilter: o => {
                        const startTs = getTimestamp(latest.weekStartTs) || new Date(latest.weekStart).getTime();
                        const endTs = getTimestamp(latest.weekEndTs) || new Date(latest.weekEnd).getTime();
                        return getTimestamp(o.timestamp) >= startTs && getTimestamp(o.timestamp) <= endTs;
                    }
                };
            }
            const fallbackStart = ui.getWeekStart();
            const fallbackEnd = new Date(fallbackStart);
            fallbackEnd.setDate(fallbackEnd.getDate() + 6);
            return {
                isActive: false,
                activeStartTs: null,
                weekStart: fallbackStart,
                weekEnd: fallbackEnd.toISOString().slice(0, 10),
                dateFilter: o => {
                    const date = getLocalDate(o.timestamp);
                    return date >= fallbackStart && date <= fallbackEnd.toISOString().slice(0, 10);
                }
            };
        };

        ui.getMonthStart = function(date = new Date()) {
            const d = new Date(date);
            return d.toISOString().slice(0, 7) + '-01';
        };

        ui.calculateWeeklyStats = function() {
            const range = ui.getCurrentWeeklyRange();
            const reportOrders = Object.values(state.orders || {}).filter(range.dateFilter);
            const totalSalesBefore = reportOrders.reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
            const costBefore = reportOrders.reduce((sum, o) => sum + ui.calculateIngredientCostForOrder(o), 0);
            const orderCount = reportOrders.length;
            const shiftsCount = Object.values(state.shifts || {}).filter(s => s.status === 'closed' && (() => {
                if (range.isActive) {
                    return (getTimestamp(s.endTime) && getTimestamp(s.endTime) >= range.activeStartTs) || (getTimestamp(s.startTime) && getTimestamp(s.startTime) >= range.activeStartTs);
                }
                return s.date >= range.weekStart && s.date <= range.weekEnd;
            })()).length;
            const netBefore = totalSalesBefore - costBefore;
            return { totalSales: totalSalesBefore, ingredientCost: costBefore, netSales: netBefore, shiftsCount, orderCount };
        };

        ui.calculateWeeklyUsage = function() {
            const range = ui.getCurrentWeeklyRange();
            const weekOrders = Object.values(state.orders || {}).filter(range.dateFilter);
            const usage = {};
            weekOrders.forEach(o => {
                (o.items || []).forEach(item => {
                    const itemQty = getItemQty(item);
                    if (Array.isArray(item.recipe)) {
                        item.recipe.forEach(r => {
                            if (r && r.id && typeof r.amt === 'number') {
                                const inv = state.inventory[r.id] || {};
                                if (!usage[r.id]) {
                                    usage[r.id] = {
                                        id: r.id,
                                        name: inv.name || 'Unknown',
                                        qty: 0,
                                        costPerUnit: parseFloat(inv.cost) || 0,
                                        stockLeft: typeof inv.qty !== 'undefined' ? inv.qty : null,
                                        unit: inv.unit || 'units'
                                    };
                                }
                                usage[r.id].qty += r.amt * itemQty;
                            }
                        });
                    }
                });
            });
            const usageList = Object.values(usage).map(u => ({
                ...u,
                totalCost: u.qty * u.costPerUnit
            })).sort((a, b) => b.qty - a.qty);
            const totalUsedCost = usageList.reduce((sum, item) => sum + item.totalCost, 0);
            return { usage: usageList, totalUsedCost, weekOrders };
        };

        ui.calculateMonthlyStats = function(monthStart) {
            const monthKey = monthStart.slice(0, 7);
            const monthReports = Object.values(state.weeklyReports || {}).filter(r => r.month === monthKey);
            const totalSales = monthReports.reduce((sum, r) => sum + (parseFloat(r.totalSales) || 0), 0);
            const cost = monthReports.reduce((sum, r) => sum + (parseFloat(r.ingredientCost) || 0), 0);
            const netSales = totalSales - cost;
            const monthOrders = Object.values(state.orders || {}).filter(o => {
                if (!o.timestamp) return false;
                const date = getLocalDate(o.timestamp);
                return date.startsWith(monthKey);
            });
            const totalOrderCount = monthOrders.length;
            const totalItemsSold = monthOrders.reduce((sum, o) => sum + ((o.items || []).reduce((itemSum, i) => itemSum + (parseFloat(i.qty) || 0), 0)), 0);
            const totalInventoryCost = Object.values(state.inventory || {}).reduce((sum, inv) => sum + ((parseFloat(inv.cost) || 0) * (parseFloat(inv.qty) || 0)), 0);

            return {
                totalSales,
                ingredientCost: cost,
                netSales,
                weeksCount: monthReports.length,
                totalOrders: totalOrderCount,
                totalItemsSold,
                totalInventoryCost
            };
        };

        ui.endOfWeekInventory = function() {
            if (!user.cashier) return alert('Please login to end the week.');
            if (!state.currentWeekStartTs) return alert('No active weekly inventory to end. Start the week first.');
            const weekStart = ui.getCurrentWeekStart();
            const stats = ui.calculateWeeklyStats(weekStart);
            if (stats.shiftsCount === 0) return alert('No closed shifts this week.');
            
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);
            const weekKey = weekStart + '_to_' + weekEnd.toISOString().slice(0, 10);
            const reportData = {
                weekStart,
                weekEnd: weekEnd.toISOString().slice(0, 10),
                weekStartTs: state.currentWeekStartTs,
                weekEndTs: weekEnd.getTime(),
                month: weekStart.slice(0, 7),
                totalSales: stats.totalSales,
                ingredientCost: stats.ingredientCost,
                netSales: stats.netSales,
                shiftsCount: stats.shiftsCount,
                createdAt: Date.now()
            };
            db.ref('weeklyReports/' + weekKey).set(reportData);
            db.ref('metaData/currentWeekStart').remove();
            db.ref('metaData/currentWeekStartTs').remove();
            state.currentWeekStart = null;
            state.currentWeekStartTs = null;
            alert(`Week ended. Total sales: ₱${stats.totalSales.toFixed(2)}, Ingredient cost: ₱${stats.ingredientCost.toFixed(2)}, Net: ₱${stats.netSales.toFixed(2)}. Start a new weekly inventory when ready.`);
            ui.openModal('WEEKLY_REPORT');
        };

        ui.startWeeklyInventory = function() {
            if (!user.cashier) return alert('Please login to start the week.');
            if (state.currentWeekStartTs) return alert('Weekly inventory is already active. End the current week before starting a new one.');
            const today = getLocalDate(Date.now());
            const nowTs = Date.now();
            db.ref('metaData/currentWeekStart').set(today);
            db.ref('metaData/currentWeekStartTs').set(nowTs);
            state.currentWeekStart = today;
            state.currentWeekStartTs = nowTs;
            alert('Weekly inventory started. Stock from previous week carries forward automatically.');
        };

        ui.getMonthEnd = function(monthStart) {
            const date = new Date(monthStart);
            date.setMonth(date.getMonth() + 1);
            date.setDate(0);
            return date.toISOString().slice(0, 10);
        };

        ui.endOfMonthInventory = function() {
            if (!user.cashier) return alert('Please login to end the month.');
            const monthStart = state.currentMonthStart || ui.getMonthStart();
            const stats = ui.calculateMonthlyStats(monthStart);
            const monthKey = monthStart.slice(0, 7);
            const monthEnd = ui.getMonthEnd(monthStart);
            const reportData = {
                monthStart,
                monthEnd,
                totalSales: stats.totalSales,
                ingredientCost: stats.ingredientCost,
                netSales: stats.netSales,
                totalOrders: stats.totalOrders,
                totalItemsSold: stats.totalItemsSold,
                weeksCount: stats.weeksCount,
                createdAt: Date.now()
            };
            db.ref('monthlyReports/' + monthKey).set(reportData);

            const nextMonth = new Date(monthStart);
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            const nextMonthStart = ui.getMonthStart(nextMonth);
            db.ref('metaData/currentMonthStart').set(nextMonthStart);
            state.currentMonthStart = nextMonthStart;
            alert(`Month ended. New monthly period started: ${nextMonthStart}. Total sales: ₱${stats.totalSales.toFixed(2)}, Ingredient cost: ₱${stats.ingredientCost.toFixed(2)}, Net: ₱${stats.netSales.toFixed(2)}`);
            ui.openModal('MONTHLY_REPORT');
        };

        ui.startMonthlyInventory = function() {
            if (!user.cashier) return alert('Please login to start the month.');
            const newMonthStart = ui.getMonthStart();
            db.ref('metaData/currentMonthStart').set(newMonthStart);
            state.currentMonthStart = newMonthStart;

        ui.calculateIngredientCostForOrder = function(order) {
            let cost = 0;
            (order.items || []).forEach(item => {
                const qty = item.qty || 1;
                if (item.recipe && Array.isArray(item.recipe)) {
                    item.recipe.forEach(r => {
                        cost += ((state.inventory[r.id]?.cost || 0) * (r.amt || 0)) * qty;
                    });
                }
            });
            return cost;
        };

            const openBtn = document.getElementById('open-shift-btn');

            const shift = ui.getActiveShift();
            if (shift && shift.status === 'open') {
                if (openBtn) {
                    openBtn.classList.add('btn-success');
                    openBtn.classList.remove('btn-danger');
                }
                if (closeBtn) {
                    closeBtn.classList.add('btn-danger');
                    closeBtn.classList.remove('btn-success');
                }
            } else {
                if (openBtn) {
                    openBtn.classList.add('btn-danger');
                    openBtn.classList.remove('btn-success');
                }

                    closeBtn.classList.add('btn-success');

                }

        ui.openShift = function() {
            if (!user.cashier) return alert('Please login first to open a shift.');
            if (ui.getActiveShift()) return alert('A shift is already open. Close it before opening a new one.');
            const ref = window.db.ref('shifts').push();
            ref.set({
                startTime: Date.now(),
                status: 'open',
                cashier: user.cashier,
                date: getLocalDate(Date.now()),
                createdAt: Date.now()
            });
            window.logActivity('OPEN_SHIFT', { shiftId: ref.key, date: new Date().toISOString().slice(0, 10) });
            ui.updateShiftStatus();
            alert('Shift opened successfully.');
        };

        ui.closeShift = function() {
            const shift = ui.getActiveShift();
            if (!shift) return alert('No open shift found.');
            if (!confirm('Are you sure you want to close the shift?')) return;
            const endTime = Date.now();
            const shiftOrders = Object.values(state.orders || {}).filter(o => getTimestamp(o.timestamp) >= getTimestamp(shift.startTime) && getTimestamp(o.timestamp) <= endTime);
            const totalSales = shiftOrders.reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
            const ingredientCost = shiftOrders.reduce((sum, o) => sum + ui.calculateIngredientCostForOrder(o), 0);
            const netSales = totalSales - ingredientCost;
            window.db.ref('shifts/' + shift.id).update({
                endTime,
                status: 'closed',
                totalSales,
                ingredientCost,
                netSales,
                totalOrders: shiftOrders.length,
                closedAt: Date.now()
            });
            window.logActivity('CLOSE_SHIFT', { shiftId: shift.id, totalSales, ingredientCost, netSales, totalOrders: shiftOrders.length });

            alert(`Shift closed. Total sales: ₱${totalSales.toFixed(2)}, Ingredient cost: ₱${ingredientCost.toFixed(2)}`);

        ui.saveStock = function() {
                const id = document.getElementById('stock-id').value;
                const addQty = parseFloat(document.getElementById('stock-add-qty').value);
                if (!id || isNaN(addQty) || addQty <= 0) {
                    alert('Enter a valid quantity to add');
                    return;
                }
                const item = state.inventory[id];
                if (!item) {
                    alert('Ingredient not found');
                    return;
                }
                const stockRef = db.ref('inventory/' + id + '/qty');
                stockRef.transaction(current => {
                    return (parseFloat(current) || 0) + addQty;
                }, (error, committed, snapshot) => {
                    if (error) {
                        console.error('Stock transaction failed:', error);
                        alert('Unable to update stock. Please try again.');
                        return;
                    }
                    if (!committed) {
                        alert('Stock update was not committed. Please try again.');
                        return;
                    }
                    const newQty = parseFloat(snapshot.val()) || 0;
                    const log = { ingredient: item.name, ingredientId: id, change: addQty, newQty, costPerUnit: item.cost || 0, costTotal: (item.cost || 0) * addQty, timestamp: Date.now() };
                    db.ref('stock_logs').push(log).then(() => {
                        updateLocalInventoryQty(id, newQty);
                        window.logActivity('ADD_STOCK', { ingredientId: id, name: item.name, addedQty: addQty, newQty });
                        return db.ref('inventory/' + id + '/qty').once('value');
                    }).then(snapshot => {
                        const syncedQty = parseFloat(snapshot.val()) || 0;
                        updateLocalInventoryQty(id, syncedQty);
                        return ui.syncInventoryFromDatabase();
                    }).finally(() => ui.closeModal());
                });
        };
        ui.calculateCartUsage = function() {
            const usage = {};
            state.cart.forEach(item => {
                const qty = item.qty || 1;
                if (!item.recipe || !Array.isArray(item.recipe)) return;
                item.recipe.forEach(r => {
                    if (r && r.id && typeof r.amt === 'number') {
                        usage[r.id] = (usage[r.id] || 0) + (r.amt * qty);
                    }
                });
            });
            return usage;
        };
        ui.verifyStockForCart = function() {
            const usage = ui.calculateCartUsage();
            return db.ref('inventory').once('value').then(snapshot => {
                const inventory = snapshot.val() || {};
                const missing = [];
                Object.entries(usage).forEach(([id, needed]) => {
                    const avail = getTimestamp(inventory[id]?.qty);
                    if (avail < needed) {
                        missing.push({ id, needed, avail, name: inventory[id]?.name || state.inventory[id]?.name || 'Unknown' });
                    }
                });
                if (missing.length) return Promise.reject(missing);
                return Promise.resolve(usage);
            });
        };
        const runTransaction = (ref, updateFn) => new Promise((resolve, reject) => {
            ref.transaction(updateFn, (error, committed, snapshot) => {
                if (error) return reject(error);
                if (!committed) return reject(new Error('Transaction not committed'));
                resolve(snapshot.val());
            });
        });

        ui.commitOrderFromData = function(id) {
                const data = state.products[id];
                if (!data) return;
                const modMap = {};
                const modRecipes = [];
                let b1t1Applied = false;
                const addMod = (m, id) => {
                    if (!m) return;
                    const modId = id || m.id;
                    if (!modId) return;
                    if (!modMap[modId]) {
                        modMap[modId] = { id: modId, name: m.name, price: parseFloat(m.price) || 0 };
                        if (m.recipe && Array.isArray(m.recipe)) modRecipes.push(...m.recipe);
                    }
                };
                // Process Multi-selection Add-ons
                document.querySelectorAll('.sel-mod:checked').forEach(c => addMod(state.modifiers[c.dataset.id], c.dataset.id));
                // Process B1T1 Promo Radio Button
                const b1t1Radio = document.querySelector('.sel-b1t1:checked');
                if (b1t1Radio) {
                    const b1t1Mod = state.modifiers[b1t1Radio.dataset.id];
                    if (b1t1Mod) {
                        addMod(b1t1Mod, b1t1Radio.dataset.id);
                        b1t1Applied = true;
                    }
                }
                // Process Free Flavor Dropdown
                const f = document.getElementById('s-flav');
                if (f && f.value) addMod(state.modifiers[f.value]);
                // Process Paid Size Dropdown
                const s = document.getElementById('s-size');
                if (s && s.value) addMod(state.modifiers[s.value]);

                const mods = Object.values(modMap);
                const itemRecipe = data.recipe || [];
                const fullRecipe = itemRecipe.concat(modRecipes);
                
                // Check stock availability
                for (const r of fullRecipe) {
                    if (r && r.id && typeof r.amt === 'number') {
                        const inv = state.inventory[r.id];
                        if (!inv || inv.qty < r.amt) {
                            alert(`Insufficient stock for ${inv ? inv.name : 'unknown ingredient'}. Required: ${r.amt}, Available: ${inv ? inv.qty : 0}`);
                            return;
                        }
                    }
                }
                
                const modPrice = mods.reduce((sum, m) => sum + (parseFloat(m.price) || 0), 0);
                const modNames = mods.length ? mods.map(m => m.name).join(', ') : '';
                pos.addToCart({ id, name: data.name, price: parseFloat(data.price) || 0, mods, modPrice, modNames, recipe: fullRecipe, b1t1: b1t1Applied });
                ui.closeModal();
        };

        ui.finalize = function(method, paid = 0, change = 0, isGcashPayment = false) {
                const total = parseCurrency(document.getElementById('total-ui').innerText);
                if (isNaN(total) || total <= 0) {
                    alert("Invalid total amount");
                    return;
                }
                ui.verifyStockForCart().then(usage => {
                    const transactionPromises = Object.entries(usage).map(([id, needed]) => {
                        const ref = db.ref('inventory/' + id + '/qty');
                        return runTransaction(ref, current => {
                            const currentQty = getTimestamp(current);
                            if (currentQty < needed) return;
                            return currentQty - needed;
                        }).then(newQty => {
                            const qtyValue = getTimestamp(newQty);
                            const itemName = state.inventory[id]?.name || 'Unknown';
                            updateLocalInventoryQty(id, qtyValue);
                            return db.ref('stock_logs').push({
                                ingredient: itemName,
                                ingredientId: id,
                                change: -needed,
                                newQty: qtyValue,
                                costPerUnit: state.inventory[id]?.cost || 0,
                                costTotal: (state.inventory[id]?.cost || 0) * needed,
                                timestamp: Date.now(),
                                note: 'Used in order'
                            });
                        });
                    });
                    return Promise.all(transactionPromises).then(() => {
                        ui.printReceipt(total, paid, method, change);
                        const order = { items: state.cart, total, method, timestamp: Date.now(), orderType: ui.orderType, paid, change, cashier: user.cashier };

        admin.calculateUsage = function() {
            const usage = {};
            Object.values(state.orders).forEach(o => {
                (o.items || []).forEach(item => {
                    if (item.recipe && Array.isArray(item.recipe)) {
                        item.recipe.forEach(r => {
                            if (r && r.id && typeof r.amt === 'number') {
                                usage[r.id] = (usage[r.id] || 0) + r.amt;
                            }
                        });
                    }
                });
            });
            const totalUsedAmount = Object.values(usage).reduce((sum, amt) => sum + amt, 0);
            const totalUsedCost = Object.entries(usage).reduce((sum, [id, amt]) => sum + ((state.inventory[id]?.cost || 0) * amt), 0);
            return { usage, totalUsedAmount, totalUsedCost };
        };

            const chartCanvas = document.getElementById('salesChart');
            if (!chartCanvas) return;
            if (window.salesChartInstance) {
                try { window.salesChartInstance.destroy(); } catch (err) { console.warn('Error destroying previous chart', err); }
                window.salesChartInstance = null;
            }
            const ctx = chartCanvas.getContext('2d');
            const orders = Object.values(state.orders);
            const today = new Date();
            const dayLabels = [];
            const dayData = [];
            for(let i = 6; i >= 0; i--) {
                const day = new Date(today);
                day.setDate(today.getDate() - i);
                const label = day.toLocaleDateString('en-US', { weekday: 'short' });

                    .reduce((sum, o) => sum + (parseFloat(o.total) || 0), 0);
                dayLabels.push(label);
                dayData.push(total.toFixed(2));
            }
            window.salesChartInstance = new Chart(ctx, {

        admin.deleteSale = function(id) {
            if (!id || !state.orders[id]) return;
            if (!confirm('Delete this sale record and restore ingredients to inventory?')) return;
            const order = state.orders[id];
            (order.items || []).forEach(item => {
                const qty = parseInt(item.qty, 10) || 1;
                if (!Array.isArray(item.recipe)) return;
                item.recipe.forEach(r => {
                    if (!r || !r.id) return;
                    const restoreAmount = (parseFloat(r.amt) || 0) * qty;
                    if (restoreAmount <= 0) return;
                    db.ref('inventory/' + r.id + '/qty').transaction(current => {
                        return (parseFloat(current) || 0) + restoreAmount;
                    });
                    const ingredientName = state.inventory[r.id]?.name || ('Ingredient ' + r.id);
                    db.ref('stock_logs').push({
                        ingredient: ingredientName,
                        ingredientId: r.id,
                        change: restoreAmount,
                        newQty: (parseFloat(state.inventory[r.id]?.qty) || 0) + restoreAmount,
                        costPerUnit: parseFloat(state.inventory[r.id]?.cost) || 0,
                        costTotal: ((parseFloat(state.inventory[r.id]?.cost) || 0) * restoreAmount),
                        timestamp: Date.now(),
                        note: 'Restored from deleted sale ' + id
                    });
                });
            });
            window.logActivity('DELETE_SALE', { orderId: id, cashier: order.cashier, total: order.total });
            db.ref('orders/' + id).remove();
        };

                                    html += `<div style="margin-bottom:18px; padding:12px; border:1px solid rgba(255,255,255,0.08); border-radius:18px; background:rgba(255,255,255,0.03);"><div style="font-size:0.95rem; font-weight:800; color:var(--primary); margin-bottom:12px;">${label}</div>`;
                                    sideGroups[sub].forEach(([id, p]) => {
                                        html += `<div class="menu-list-row"><div style="display:flex; align-items:center; gap:12px;"><img src="${p.img || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'" style="width:45px; height:45px; border-radius:10px; object-fit:cover;" /><div><b>${p.name}</b><br /><small style="color:var(--text-dim);">₱${p.price.toFixed(2)}</small></div></div><div><button class="btn-glam" onclick="ui.openModal('EDIT_ITEM', {id:'${id}', ...state.products['${id}']})">EDIT</button><button class="btn-danger" onclick="if(confirm('Delete ${safeText(p.name)}?')) db.ref('products/${id}').remove()">DELETE</button></div></div>`;
                                    });
                                    html += `</div>`;
                                });
                                html += `</div>`;
                            } else {
                                html += `<div style="margin-bottom:25px;"><div style="display:inline-block; background:var(--primary); color:#000; padding:8px 18px; border-radius:12px; font-weight:900; margin-bottom:18px;">${cat.toUpperCase()}</div>`;
                                items.forEach(([id, p]) => {
                                    html += `<div class="menu-list-row"><div style="display:flex; align-items:center; gap:12px;"><img src="${p.img || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'" style="width:45px; height:45px; border-radius:10px; object-fit:cover;" /><div><b>${p.name}</b><br /><small style="color:var(--text-dim);">₱${p.price.toFixed(2)}</small></div></div><div><button class="btn-glam" onclick="ui.openModal('EDIT_ITEM', {id:'${id}', ...state.products['${id}']})">EDIT</button><button class="btn-danger" onclick="if(confirm('Delete ${safeText(p.name)}?')) db.ref('products/${id}').remove()">DELETE</button></div></div>`;
                                });
                                html += `</div>`;
                            }
                        }
                    });
                    root.innerHTML = html;
                }
                else if(admin.tab === 'mod') {
                    const filteredMods = Object.entries(state.modifiers).filter(([id, m]) => admin.modFilter === 'all' || m.type === admin.modFilter);
                    const modGroups = {};
                    filteredMods.forEach(([id, m]) => {
                        const type = m.type || 'other';
                        if (!modGroups[type]) modGroups[type] = [];
                        modGroups[type].push([id, m]);
                    });
                    const typeOrder = ['addon', 'sides_addon', 'drink_type', 'drink_size', 'other'];
                    let html = `<button class="btn-glam" onclick="document.getElementById('admin-panel').style.display = 'none';">BACK TO POS</button><br /><br />
                        <div style="display:flex; gap:10px; margin-bottom:20px; overflow-x:auto;">
                            <button class="btn-glam ${admin.modFilter === 'all' ? 'active' : ''}" onclick="admin.setModFilter('all', this)">ALL MODIFIERS</button>
                            <button class="btn-glam ${admin.modFilter === 'addon' ? 'active' : ''}" onclick="admin.setModFilter('addon', this)">ADDS ON (BURGERS)</button>
                            <button class="btn-glam ${admin.modFilter === 'sides_addon' ? 'active' : ''}" onclick="admin.setModFilter('sides_addon', this)">ADDS ON (SIDES)</button>
                            <button class="btn-glam ${admin.modFilter === 'drink_type' ? 'active' : ''}" onclick="admin.setModFilter('drink_type', this)">DRINKS (TYPES)</button>
                            <button class="btn-glam ${admin.modFilter === 'drink_size' ? 'active' : ''}" onclick="admin.setModFilter('drink_size', this)">DRINKS/SIDES SIZE</button>
                        </div>
                        <button class="btn-glam active" onclick="ui.openModal('ADD_MOD')">CREATE MODIFIER</button><br /><br />`;
                    typeOrder.forEach(type => {
                        const mods = modGroups[type] || [];
                        if(mods.length) {
                            const typeLabel = type === 'addon' ? 'ADDS ON (BURGERS)' : type === 'sides_addon' ? 'ADDS ON (SIDES)' : type === 'drink_type' ? 'DRINKS (TYPES)' : type === 'drink_size' ? 'DRINKS/SIDES SIZE' : type.toUpperCase();
                            html += `<div style="margin-bottom:25px;"><div style="display:inline-block; background:var(--primary); color:#000; padding:8px 18px; border-radius:12px; font-weight:900; margin-bottom:18px;">${typeLabel}</div><table class="titan-table"><thead><tr><th>NAME</th><th>TYPE</th><th>FEE</th><th>EDIT</th><th>DELETE</th></tr></thead><tbody>${mods.map(([id, m]) => `<tr><td>${m.name}</td><td>${m.type}</td><td>₱${m.price}</td><td><button class="btn-glam" onclick="ui.openModal('EDIT_MOD', {id:'${id}', ...state.modifiers['${id}']})">EDIT</button></td><td><button class="btn-danger" onclick="if(confirm('Delete ${safeText(m.name)}?')) db.ref('modifiers/${id}').remove()">DELETE</button></td></tr>`).join('')}</tbody></table></div>`;
                        }
                    });
                    root.innerHTML = html;
                }
                else if(admin.tab === 'sales') {
                    const orders = Object.entries(state.orders || {}).sort((a,b) => new Date(b[1].timestamp) - new Date(a[1].timestamp));
                    const today = getLocalDate(Date.now());
                    const shift = ui.getLatestShiftToday();
                    const dailyOrders = shift && shift.date === today
                        ? orders.filter(([id, o]) => getTimestamp(o.timestamp) >= getTimestamp(shift.startTime) && (!shift.endTime || getTimestamp(o.timestamp) <= getTimestamp(shift.endTime)))
                        : orders.filter(([id, o]) => isTodayLocal(o.timestamp));
                    const sum = rows => rows.reduce((acc, [id, o]) => acc + (parseFloat(o.total) || 0), 0);
                    const orderRows = dailyOrders.map(([id, o]) => {
                        const orderText = (o.items || []).map(i => safeText(i.name) + (i.modNames ? ' (' + safeText(i.modNames) + ')' : '')).join(' | ');
                        return '<tr><td>' + new Date(o.timestamp).toLocaleString() + '</td><td>' + safeText(o.cashier || 'Unknown') + '</td><td style="max-width:420px;">' + (orderText || 'No items') + '</td><td>₱' + (parseFloat(o.total) || 0).toFixed(2) + '</td><td><button class="btn-danger" style="padding:6px 12px; font-size:0.85rem;" onclick="admin.deleteSale(\'' + id + '\')">×</button></td></tr>';
                    }).join('');
                    const detailSection = '<div style="overflow-x:auto; margin-top:20px;"><table class="titan-table" style="width:100%; min-width:900px;"><thead><tr><th>Date / Time</th><th>Cashier</th><th>Order</th><th>Total</th><th>Delete</th></tr></thead><tbody>' + orderRows + '</tbody></table></div>';
                    const html = '<button class="btn-glam" onclick="document.getElementById(\'admin-panel\').style.display = \'none\';">BACK TO POS</button><br /><br /><h1>DAILY SALES LOGS</h1>' +
                        '<div style="display:grid; grid-template-columns: repeat(1, minmax(200px, 1fr)); gap:20px; margin-bottom:20px;">' +
                            '<div class="cart-total-box" style="text-align:center;"><span>TODAY\'S SALES</span><h2 style="color:var(--success);">₱' + sum(dailyOrders).toFixed(2) + '</h2><small>' + dailyOrders.length + ' orders</small></div>' +
                        '</div>' +
                        detailSection;
                    root.innerHTML = html;
                }
        };
    </script>
</body>
</html>
