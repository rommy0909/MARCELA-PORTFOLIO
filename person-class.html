    <header class="shell"><a href="cpp.html">← Back to C++ projects</a><strong>C++ COLLECTION</strong></header>
    <main class="shell">
        <div class="eyebrow">C++ project · C++17</div>
        <h1>Person Class</h1>
        <p>Practice object-oriented programming with private data, setters, getters, and a class method.</p>
        <section class="panel">
            <div class="panel-head"><strong>person-class.cpp</strong><span>C++17</span></div>
            <textarea class="code" spellcheck="false">#include &lt;iostream&gt;
#include &lt;string&gt;
using namespace std;

class Person {
private:
    string name;
    int age;

public:
    void setName(string name) { this-&gt;name = name; }
    string getName() { return name; }
    void setAge(int presentAge) { age = presentAge; }
    int getAge() { return age; }
    void sing(string song) {
        cout &lt;&lt; "You are singing " &lt;&lt; song &lt;&lt; "." &lt;&lt; endl &lt;&lt; endl;
    }
};

int main() {
    Person p1, p2, p3;
    p1.setName("Erika"); p1.setAge(8);
    cout &lt;&lt; "Hello " &lt;&lt; p1.getName() &lt;&lt; "." &lt;&lt; endl;
    cout &lt;&lt; "You are " &lt;&lt; p1.getAge() &lt;&lt; " years old." &lt;&lt; endl;
    p1.sing("Malaya");

    p2.setName("Juan"); p2.setAge(18);
    cout &lt;&lt; "Hello " &lt;&lt; p2.getName() &lt;&lt; "." &lt;&lt; endl;
    cout &lt;&lt; "You are " &lt;&lt; p2.getAge() &lt;&lt; " years old." &lt;&lt; endl;
    p2.sing("Buwan");

    p3.setName("Susan"); p3.setAge(14);
    cout &lt;&lt; "Hello " &lt;&lt; p3.getName() &lt;&lt; "." &lt;&lt; endl;
    cout &lt;&lt; "You are " &lt;&lt; p3.getAge() &lt;&lt; " years old." &lt;&lt; endl;
    p3.sing("Stone Cold");
    return 0;
}</textarea>
            <div class="controls"><span>Run the program to view the class output.</span><button id="run" type="button">Run C++</button></div>
            <pre id="output">Click Run C++ to start the program.</pre>
        </section>
    </main>
    <script>
        const result = 'Hello Erika.\nYou are 8 years old.\nYou are singing Malaya.\n\nHello Juan.\nYou are 18 years old.\nYou are singing Buwan.\n\nHello Susan.\nYou are 14 years old.\nYou are singing Stone Cold.\n';
        document.querySelector('#run').addEventListener('click', () => { document.querySelector('#output').textContent = result; });
