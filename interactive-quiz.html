    function renderLogin() { app.innerHTML = `<div class="login"><div class="login-box"><div class="brand">quiz<span>ly</span></div><div class="eyebrow">Interactive Quiz System</div><h1 id="login-title">Join your class.</h1><p class="login-subtitle">Choose your account type to continue.</p><div class="login-roles"><button type="button" class="login-role active" id="student-login" onclick="setLoginRole('Student')">Student Access</button><button type="button" class="login-role" id="teacher-login" onclick="setLoginRole('Instructor')">Teacher Account</button></div><form onsubmit="login(event)"><div class="field"><label>Name<input id="username" required placeholder="Enter your full name"></label></div><div class="field"><label>Email<input id="email" type="email" required placeholder="Enter your email"></label></div><div class="form-grid" id="student-fields"><div class="field"><label>Course<input id="course" required placeholder="e.g. ICT - A"></label></div><div class="field"><label>Year level<input id="grade" required placeholder="e.g. Grade 12"></label></div></div><div class="field" id="password-field" style="display:none"><label>Password<input id="password" type="password" minlength="6" placeholder="At least 6 characters"></label></div><div class="field" id="teacher-code-field"><label>Teacher code<input id="teacherCode" required placeholder="Code from your teacher"></label></div><button class="btn" type="submit" id="login-submit">Enter as Student</button></form><button type="button" class="login-switch" id="teacher-mode-switch" onclick="toggleTeacherAuthMode()" style="display:none">Already have an account? Log in</button><div class="hint" id="login-hint">Your email will be used to recognize your quiz records.</div></div></div>`; }

    async function login(e) { e.preventDefault(); const button=document.getElementById('login-submit'); if(button.disabled)return; const email=document.getElementById('email').value.trim().toLowerCase(); const name=document.getElementById('username').value.trim(); if(loginRole==='Student'){ const teacherCode=document.getElementById('teacherCode').value.trim().toUpperCase(); let teacherFound=teacherCode===(localStorage.getItem('quizly-teacher-code')||'TEACH-2026'); if(!teacherFound){ try { const snapshot=await firestore.collection('users').where('role','==','Instructor').where('teacherCode','==',teacherCode).limit(1).get(); teacherFound=!snapshot.empty; } catch(error) { toast('Unable to verify teacher code. Check your connection.'); return; } } if(!teacherFound){toast('Teacher code not recognized');return;} const profile={uid:null,name,email,grade:document.getElementById('grade').value.trim(),course:document.getElementById('course').value.trim(),role:'Student',teacherCode}; localStorage.setItem('quizly-user',JSON.stringify(profile)); await loadCloudData(); renderShell('quizzes'); return; } const signup=teacherAuthMode==='signup'; button.disabled=true; button.textContent=signup?'Creating account...':'Logging in...'; try { const password=document.getElementById('password').value; const authTask=signup?firebaseAuth.createUserWithEmailAndPassword(email,password):firebaseAuth.signInWithEmailAndPassword(email,password); const credential=await Promise.race([authTask,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Firebase connection timed out. Check your internet connection.')),10000))]); const teacherCode=signup?createTeacherCode():(localStorage.getItem('quizly-teacher-code')||'TEACH-2026'); const profile={uid:credential.user.uid,name,email,grade:'Faculty',course:'Electrical Installation',role:'Instructor',teacherCode}; await firestore.collection('users').doc(credential.user.uid).set(profile,{merge:true}); localStorage.setItem('quizly-teacher-code',profile.teacherCode); if(signup){ await firebaseAuth.signOut(); toast('Teacher account created. Your code is '+profile.teacherCode+'. Please log in.'); renderLogin(); setLoginRole('Instructor'); teacherAuthMode='login'; updateLoginForm(); return; } localStorage.setItem('quizly-user',JSON.stringify(profile)); await loadCloudData(); renderShell('dashboard'); } catch(error) { const messages={'auth/email-already-in-use':'Account already exists. Opening Teacher Login.','auth/user-not-found':'Teacher account not found. Please sign up first.','auth/wrong-password':'Incorrect password.','auth/weak-password':'Password must be at least 6 characters.'}; if(error.code==='auth/email-already-in-use'){ toast(messages[error.code]); renderLogin(); setLoginRole('Instructor'); teacherAuthMode='login'; updateLoginForm(); return; } button.disabled=false; button.textContent=signup?'Sign up as Teacher':'Log in as Teacher'; toast(messages[error.code]||error.message||'Teacher authentication failed'); } }
    function renderShell(view) { const user=JSON.parse(localStorage.getItem('quizly-user')); const student=user.role==='Student'; clearInterval(availabilityTimer); app.innerHTML=`<div class="shell"><aside><div class="brand">quiz<span>ly</span></div><nav class="nav">${student?'':`<button class="${view==='dashboard'?'active':''}" onclick="renderShell('dashboard')"><span class="nav-icon">⌂</span>Overview</button>`}<button class="${view==='quizzes'?'active':''}" onclick="renderShell('quizzes')"><span class="nav-icon">▤</span>${student?'Quizzes':'My quizzes'}</button><button class="${view==='records'?'active':''}" onclick="openRecords()"><span class="nav-icon">◷</span>${student?'My records':'Class records'}</button>${user.role==='Instructor'?'<button class="'+(view==='create'?'active':'')+'" onclick="renderShell(\'create\')"><span class="nav-icon">＋</span>Create quiz</button>':''}</nav><div class="side-note">Small steps, strong foundations.<br>Build knowledge that lasts.</div></aside><main><header class="topbar"><div><div class="eyebrow">${user.role} workspace</div></div><div class="profile"><div class="avatar">${user.name.charAt(0).toUpperCase()}</div><span>${user.name}</span><button class="btn ghost" onclick="logout()">Sign out</button></div></header><section id="content"></section></main></div>`; renderView(view); if(view==='dashboard'||view==='quizzes') availabilityTimer=setInterval(()=>renderView(view),1000); }
    function renderView(view) { const c=document.getElementById('content'); if(!c)return; const user=JSON.parse(localStorage.getItem('quizly-user')); if(view==='dashboard') c.innerHTML=dashboard(); if(view==='quizzes') c.innerHTML=quizList(); if(view==='records') c.innerHTML=user.role==='Student'?studentRecordsView():recordsView(); if(view==='create') c.innerHTML=createView(); }
    function dashboard() { const user=JSON.parse(localStorage.getItem('quizly-user')); const ownRecords=records.filter(r=>r.student===user.name||r.email===user.email); const teacherQuizzes=quizzes.filter(q=>!isDemoQuiz(q)&&(q.teacherCode===user.teacherCode||q.createdBy===user.uid)).sort((a,b)=>deadlineValue(a)-deadlineValue(b)); const stats=user.role==='Instructor'?`<div class="stat"><small>Quizzes you make</small><strong>${teacherQuizzes.length}</strong></div><div class="stat"><small>Quizzes completed</small><strong>${records.filter(r=>r.teacherCode===user.teacherCode).length}</strong></div>`:`<div class="stat"><small>Available quizzes</small><strong>${teacherQuizzes.length}</strong></div><div class="stat"><small>Quizzes completed</small><strong>${ownRecords.length}</strong></div><div class="stat"><small>Correct answers</small><strong>${ownRecords.reduce((sum,r)=>sum+r.correct,0)}/${ownRecords.reduce((sum,r)=>sum+r.total,0)||0}</strong></div>`; const codePanel=user.role==='Instructor'?`<div class="panel teacher-code-panel"><div><div class="eyebrow">Student access</div><h2>Your Teacher Code</h2><p>Give this code to your students so they can join your class.</p></div><strong class="teacher-code">${user.teacherCode||'TEACH-2026'}</strong><button class="btn alt" onclick="copyTeacherCode()">Copy code</button></div>`:''; const overviewQuizzes=teacherQuizzes; return `${codePanel}<div class="hero"><div><div class="eyebrow">Good to see you, ${user.name}</div><h1>Make every answer count.</h1><p>Practice with focused quizzes, get instant feedback, and see exactly where your knowledge grows.</p></div></div><div class="stats">${stats}</div><div class="section-head"><h2>${user.role==='Instructor'?'Your quizzes':'Continue learning'}</h2></div><div class="grid">${overviewQuizzes.map(quizCard).join('')||'<p>No quizzes available yet.</p>'}</div>`; }
    function copyTeacherCode() { const code=JSON.parse(localStorage.getItem('quizly-user')).teacherCode||'TEACH-2026'; navigator.clipboard?.writeText(code); toast('Teacher code copied: '+code); }
    function remainingText(target) { if(!target) return 'Open'; const seconds=Math.max(0,Math.ceil((new Date(target).getTime()-Date.now())/1000)); const days=Math.floor(seconds/86400), hours=Math.floor(seconds%86400/3600), minutes=Math.floor(seconds%3600/60), secs=seconds%60; return `${days?days+'d ':''}${hours?hours+'h ':''}${minutes?minutes+'m ':''}${secs}s`; }
    function inputScheduleValue(value) { return value||''; }
    function quizCard(q) { const user=JSON.parse(localStorage.getItem('quizly-user')); const state=quizState(q); const own=records.filter(r=>(r.student===user.name||r.email===user.email)&&r.quiz===q.title).sort((a,b)=>b.percent-a.percent)[0]; const missed=user.role==='Student'&&state==='ended'&&!own; const canTake=state==='live'&&!own; const canReview=user.role==='Student'&&state==='ended'&&!!own; const status=user.role==='Student'?(missed?'Missed quiz':own?`Completed · ${own.correct}/${own.total}`:state==='upcoming'?`Not available`:state==='unscheduled'?'Not available':q.endAt?`Time left: ${remainingText(q.endAt)}`:'Quiz is open'):scheduleText(q); const label=user.role==='Student'?(missed?'Missed quiz':own?'View answers':state==='upcoming'||state==='unscheduled'?'Not available':'Enter quiz'):(canTake?'Enter quiz':state==='upcoming'?'Not started yet':'No longer available'); const editOpen=user.role==='Instructor'&&editingScheduleId===q.id; const edit=user.role==='Instructor'&&editOpen?`<form class="schedule-edit" onsubmit="updateSchedule(event,${q.id})"><label>Quiz starts<input name="start" type="datetime-local" value="${inputScheduleValue(q.startAt)}" required></label><label>Quiz ends<input name="end" type="datetime-local" value="${inputScheduleValue(q.endAt)}" required></label><button class="btn" type="submit">Save</button></form>`:''; const action=canReview?`showQuizRecords('${q.title.replace(/'/g,"\\'")}')`:`startQuiz(${q.id})`; const clickable=canTake||canReview; const tools=user.role==='Instructor'?`<div class="card-actions"><button class="icon-btn" title="Edit quiz schedule" aria-label="Edit ${q.title} schedule" onclick="editQuiz(${q.id})">✎</button><button class="icon-btn delete" title="Delete quiz" aria-label="Delete ${q.title}" onclick="deleteQuiz(${q.id})">&#128465;</button></div>`:''; const schedule=q.startAt?`<div class="quiz-schedule"><div>Quiz date: <span>${new Date(q.startAt).toLocaleDateString([], {dateStyle:'medium'})}</span></div><div>Quiz starts: <span>${new Date(q.startAt).toLocaleTimeString([], {timeStyle:'short'})}</span></div><div>Quiz ends: <span>${q.endAt?new Date(q.endAt).toLocaleTimeString([], {timeStyle:'short'}):'Not set'}</span></div></div>`:`<div class="quiz-schedule">Quiz date: <span>Not set</span></div>`; return `<article class="quiz-card ${missed?'missed':''}"><div class="quiz-card-head"><div class="eyebrow">${q.subject}</div>${tools}</div><h3>${q.title}</h3>${user.role==='Instructor'?`<p>${q.description}</p>`:''}${schedule}<div class="card-meta">${user.role==='Instructor'?`<span>${q.questions.length} questions</span>`:''}<span>${status}</span></div><button class="btn ${clickable?'':'ghost'}" ${clickable?'':'disabled'} onclick="${action}">${label}</button>${edit}</article>`; }
    function quizList() { const user=JSON.parse(localStorage.getItem('quizly-user')); const visible=quizzes.filter(q=>!isDemoQuiz(q)&&(q.teacherCode===user.teacherCode||q.createdBy===user.uid)).sort((a,b)=>deadlineValue(a)-deadlineValue(b)); const active=visible.filter(q=>{const own=records.some(r=>(r.student===user.name||r.email===user.email)&&r.quiz===q.title); return user.role==='Student'?(quizState(q)!=='ended'&&!own):quizState(q)!=='ended';}); const done=visible.filter(q=>!active.includes(q)).sort((a,b)=>deadlineValue(a)-deadlineValue(b)); return `<div class="eyebrow">Library</div><h1>Choose your challenge.</h1><p>${user.role==='Instructor'?'Manage your scheduled assessments.':'Your teacher has published these assessments for your class.'}</p><div class="grid">${active.map(quizCard).join('')}${done.length?`<div class="done-divider">Already finished</div>${done.map(quizCard).join('')}`:''}</div>`; }
    let editingScheduleId=null;
    function editQuiz(id) { const quiz=quizzes.find(item=>item.id===id); if(!quiz)return; editingQuizId=id; editingScheduleId=null; quizDraft=JSON.parse(JSON.stringify(quiz)); quizInfoDraft={title:quiz.title,subject:quiz.subject,description:quiz.description,startAt:quiz.startAt,endAt:quiz.endAt}; renderEditQuizInfo(); }
    function renderEditQuizInfo() { app.innerHTML=`<main><div class="quiz-layout"><button class="btn ghost" onclick="renderShell('quizzes')">← Back to quizzes</button><div class="eyebrow" style="margin-top:30px">Instructor tools · Edit quiz</div><h1>Quiz information.</h1><p>Save information changes immediately, or continue to edit the question cards.</p><form onsubmit="beginEditBuilder(event)" class="panel"><div class="form-grid"><div class="field"><label>Quiz title<input id="editTitle" value="${quizInfoDraft.title}" required></label></div><div class="field"><label>Subject<input id="editSubject" value="${quizInfoDraft.subject}" required></label></div></div><div class="field"><label>Description<textarea id="editDescription" required>${quizInfoDraft.description}</textarea></label></div><div class="form-grid"><div class="field"><label>Quiz starts<input id="editStart" type="datetime-local" value="${quizInfoDraft.startAt}" required></label></div><div class="field"><label>Quiz ends<input id="editEnd" type="datetime-local" value="${quizInfoDraft.endAt}" required></label></div></div><div class="quiz-actions"><button class="btn alt" type="button" onclick="saveQuizInfo()">Save changes</button><button class="btn" type="submit">Now edit quiz →</button></div></form></div></main>`; }
    function beginEditBuilder(e) { e.preventDefault(); if(new Date(editStart.value)>=new Date(editEnd.value)){toast('End time must be later than start time');return;} quizDraft.title=editTitle.value; quizDraft.subject=editSubject.value; quizDraft.description=editDescription.value; quizDraft.startAt=editStart.value; quizDraft.endAt=editEnd.value; renderQuestionBuilder(); }
    async function saveQuizInfo() { if(new Date(editStart.value)>=new Date(editEnd.value)){toast('End time must be later than start time');return;} quizDraft.title=editTitle.value; quizDraft.subject=editSubject.value; quizDraft.description=editDescription.value; quizDraft.startAt=editStart.value; quizDraft.endAt=editEnd.value; const index=quizzes.findIndex(q=>q.id===editingQuizId); if(index>=0)quizzes[index]={...quizzes[index],title:quizDraft.title,subject:quizDraft.subject,description:quizDraft.description,startAt:quizDraft.startAt,endAt:quizDraft.endAt}; save(); try { await firestore.collection('quizzes').doc(String(editingQuizId)).set({title:quizDraft.title,subject:quizDraft.subject,description:quizDraft.description,startAt:quizDraft.startAt,endAt:quizDraft.endAt},{merge:true}); } catch(error) { console.warn('Quiz information saved locally; Firestore update failed.',error); } quizInfoDraft={title:quizDraft.title,subject:quizDraft.subject,description:quizDraft.description,startAt:quizDraft.startAt,endAt:quizDraft.endAt}; toast('Quiz information saved'); renderEditQuizInfo(); }
    async function deleteQuiz(id) { const quiz=quizzes.find(q=>q.id===id); if(!quiz)return; const confirmed=confirm(`Are you sure you want to delete "${quiz.title}"? This will also remove its saved student records.`); if(!confirmed)return; quizzes=quizzes.filter(item=>item.id!==id); records=records.filter(record=>record.quiz!==quiz.title); save(); try { await firestore.collection('quizzes').doc(String(id)).delete(); } catch(error) { console.warn('Quiz deleted locally; Firestore delete failed.',error); } toast('Quiz deleted'); renderShell('quizzes'); }
    function updateSchedule(e,id) { e.preventDefault(); const form=e.target; const quiz=quizzes.find(q=>q.id===id); if(!quiz||new Date(form.start.value)>=new Date(form.end.value)){toast('End time must be later than start time');return;} quiz.startAt=form.start.value; quiz.endAt=form.end.value; editingScheduleId=null; save(); firestore.collection('quizzes').doc(String(id)).set(quiz,{merge:true}).catch(error=>console.warn('Schedule saved locally; Firestore update failed.',error)); toast('Quiz schedule updated'); renderShell('quizzes'); }
    function openRecords() { selectedRecordQuiz=''; selectedStudent=''; renderShell('records'); }
    function showQuizRecords(quiz) { selectedRecordQuiz=quiz; selectedStudent=''; renderShell('records'); }
    function showStudentRecord(quiz, student) { selectedRecordQuiz=quiz; selectedStudent=student; renderShell('records'); }
    function recordsView() { const user=JSON.parse(localStorage.getItem('quizly-user')); const visible=user.role==='Instructor'?records:records.filter(r=>r.student===user.name||r.email===user.email); const groups=visible.reduce((all,r)=>{(all[r.quiz]||(all[r.quiz]=[])).push(r);return all;},{}); Object.values(groups).forEach(group=>group.sort((a,b)=>b.percent-a.percent)); if(user.role==='Instructor'&&selectedStudent&&selectedRecordQuiz){const studentRecords=(groups[selectedRecordQuiz]||[]).filter(r=>(r.student||'Student')===selectedStudent); return `<div class="eyebrow">Instructor view · Student answers</div><button class="btn ghost" onclick="showQuizRecords('${selectedRecordQuiz.replace(/'/g,"\\'")}')">← Back to ${selectedRecordQuiz}</button><h1>${selectedStudent}</h1><p>${selectedRecordQuiz} · ${studentRecords.length} attempt${studentRecords.length===1?'':'s'}</p>${studentRecords.map(recordDetail).join('')}`;} if(user.role==='Instructor'&&selectedRecordQuiz){const group=groups[selectedRecordQuiz]||[]; return `<div class="eyebrow">Instructor view · Quiz folder</div><button class="btn ghost" onclick="openRecords()">← Back to quiz folders</button><h1>${selectedRecordQuiz}</h1><p>Students who answered this quiz, ranked by highest score.</p><div class="panel"><div class="section-head"><h2>Student score list</h2><span class="label">${group.length} attempts</span></div>${group.length?group.map((r,index)=>`<button class="record-row" style="width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line)" onclick="showStudentRecord('${selectedRecordQuiz.replace(/'/g,"\\'")}','${(r.student||'Student').replace(/'/g,"\\'")}')"><span><strong>${index+1}. ${r.student||'Student'}</strong><br><small>${r.date} · ${r.correct}/${r.total} correct</small></span><small>${r.passed?'PASSED':'REVIEW'}</small><strong class="record-score">${r.percent}%</strong></button>`).join(''):'<p>No students have answered this quiz yet.</p>'}</div></div>`;} if(user.role==='Student'&&selectedRecordQuiz){const group=groups[selectedRecordQuiz]||[]; return `<div class="eyebrow">My answers</div><button class="btn ghost" onclick="openRecords()">← Back to my records</button><h1>${selectedRecordQuiz}</h1>${group.map(recordDetail).join('')}`;} return `<div class="eyebrow">${user.role==='Instructor'?'Instructor view':'Progress'}</div><h1>Class records.</h1><p>${user.role==='Instructor'?'Select a quiz folder to view its ranked student scores.':'Select a completed quiz to review your answers.'}</p><div class="panel"><div class="section-head"><h2>${user.role==='Instructor'?'Quiz score folders':'Recent activity'}</h2><span class="label">${visible.length} total attempts</span></div>${visible.length?Object.entries(groups).map(([quiz,group])=>`<button class="record-group" style="display:block;width:100%;text-align:left;background:transparent;padding:0;cursor:pointer" onclick="showQuizRecords('${quiz.replace(/'/g,"\\'")}')"><h3>${quiz}</h3><div style="padding:12px 18px;font:14px Arial,sans-serif;color:var(--muted)">${user.role==='Instructor'?`${group.length} student attempt${group.length===1?'':'s'} · Highest score ${group[0].percent}%`:`${group.length} attempt${group.length===1?'':'s'} · Latest score ${group[0].percent}%`}</div></button>`).join(''):'<p>No attempts yet. Take a quiz to see your progress here.</p>'}</div>`; }

    function renderQuestionBuilder() { app.innerHTML=`<main><div class="quiz-layout"><button class="btn ghost" onclick="renderShell('create')">← Quiz information</button><div class="eyebrow" style="margin-top:30px">Instructor tools · Step 2</div><h1>Make the questions.</h1><p>${quizDraft.title} · Choose a type, paste questions, and generate cards.</p><div class="panel"><div class="section-head"><h2>Question builder</h2><span class="label">${quizDraft.questions.length} cards ready</span></div><div class="field"><label>Question type<select id="questionType"><option value="identification">Identification</option><option value="multiple">Multiple choice</option><option value="enumeration">Enumeration</option></select></label></div><div class="field"><label>Paste question(s)<textarea id="questionPaste" placeholder="Paste numbered questions here..."></textarea></label></div><button class="btn" onclick="generateQuestionCards()">Generate questions →</button></div>${quizDraft.questions.length?`<div class="panel" style="margin-top:16px"><div class="section-head"><h2>Questions added</h2><span class="label">${quizDraft.questions.length} cards</span></div>${quizDraft.questions.map((q,index)=>`<div class="review-item"><strong>${index+1}. ${q.type==='multiple'?'MULTIPLE CHOICE':q.type==='identification'?'IDENTIFICATION':'ENUMERATION'}</strong><p>${q.text}</p></div>`).join('')}</div>`:''}<div class="quiz-actions"><button class="btn ghost" onclick="renderQuizPreview()" ${quizDraft.questions.length?'':'disabled'}>View quiz →</button></div></div></main>`; }
    function generateQuestionCards() { const type=document.getElementById('questionType').value; const pasted=document.getElementById('questionPaste').value.trim(); if(!pasted){toast('Paste questions before generating');return;} const generated=parsePastedQuestions(pasted,type); if(!generated.length){toast('No questions found');return;} quizDraft.questions=assignQuestionNumbers([...quizDraft.questions,...generated]); renderQuestionBuilder(); toast(`${generated.length} question card${generated.length===1?'':'s'} added`); }

    function parsePastedQuestions(text,type) { const normalized=text.replace(/\r/g,'').trim(); if(!normalized)return []; const numbered=normalized.split(/(?=^\s*(?:\d+[.)]|Question\s*\d*[:.)]?)\s+)/im).map(block=>block.trim()).filter(Boolean); const blocks=numbered.length>1||/^\s*(?:\d+[.)]|Question\s*\d*[:.)]?)\s+/im.test(normalized)?numbered:normalized.split(/\n\s*\n+/).map(block=>block.trim()).filter(Boolean); return blocks.flatMap((block,index)=>{const lines=block.split('\n').map(line=>line.trim()).filter(Boolean); let question=lines.shift()||`Question ${index+1}`; question=question.replace(/^(?:\d+[.)]|Question\s*\d*[:.)]?)\s*/i,''); const choices=[]; let answerText=''; const extra=[]; lines.forEach(line=>{const choice=line.match(/^([A-D])[.)\-:]\s*(.+)$/i); const answerLine=line.match(/^(?:answer|correct answer|key|sagot)\s*[:\-]\s*(.+)$/i); if(choice) choices.push(choice[2].trim()); else if(answerLine) answerText=answerLine[1].trim(); else if(!/^(?:identification|enumeration|type)\s*:/i.test(line)) extra.push(line);}); if(!choices.length&&blocks.length===1&&lines.length>1&&type==='identification'){return lines.map((line,lineIndex)=>({text:line.replace(/^(?:\d+[.)]|[-*])\s*/,'').replace(/\s*(?:answer|sagot)\s*[:\-].*$/i,''),options:['Expected answer','Not answered','See lesson','None'],answer:0,type:'identification'})).filter(item=>item.text.length>2);} question=(question+' '+extra.join(' ')).trim(); const detected=type==='mixed'?(choices.length?'multiple':/enumerate|enumerate|list|give\s+\w+\s+(?:examples|items)/i.test(question)?'enumeration':'identification'):type; const options=choices.length?choices:[answerText||'Expected answer','Not answered','See lesson','None']; let answer=0; if(answerText&&choices.length){const letter=answerText.match(/^([A-D])$/i); if(letter) answer='ABCD'.indexOf(letter[1].toUpperCase()); else {const found=options.findIndex(option=>option.toLowerCase()===answerText.toLowerCase()); if(found>=0) answer=found;}} return [{text:question,options,answer:Math.max(0,answer),type:detected}];}).flat().filter(question=>question.text.length>2); }
    function generateQuestions(lesson,type) { const sentences=lesson.split(/[.!?]+/).map(text=>text.trim()).filter(text=>text.length>12); const terms=[...new Set((lesson.match(/[A-Za-z][A-Za-z-]{4,}/g)||[]).map(term=>term.toLowerCase()))].slice(0,8); const source=sentences.length?sentences:terms.map(term=>`The lesson discusses ${term}.`); const options=[...terms,'the lesson topic','none of the above'].slice(0,4); return source.slice(0,Math.min(5,source.length)).map((sentence,index)=>{if(type==='enumeration') return {text:`Enumerate the key concepts discussed in the lesson (item ${index+1}).`,options:[terms.slice(0,4).join(', ')||sentence,'One concept','Two concepts','No concepts'],answer:0,type}; if(type==='identification') return {text:`Identify the key term described by this lesson statement: ${sentence}`,options:[terms[index%Math.max(terms.length,1)]||sentence,terms[(index+1)%Math.max(terms.length,1)]||'another term','not mentioned','none'],answer:0,type}; return {text:`Which statement is included in the lesson?`,options:[sentence,...source.filter((_,itemIndex)=>itemIndex!==index).slice(0,3)],answer:0,type}; }); }
    const originalParsePastedQuestions = parsePastedQuestions;
    const enumerationItemCount = text => { const value=String(text); const words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20}; const numberPattern='(?:\\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty)'; const range=value.match(new RegExp('\\b('+numberPattern+')\\s*(?:-|–|to)\\s*('+numberPattern+')\\b','i')); if(range){ const start=Number(range[1])||words[range[1].toLowerCase()]; const end=Number(range[2])||words[range[2].toLowerCase()]; return Math.max(1,end-start+1); } const count=value.match(new RegExp('\\b(?:enumerate|enumeration|list|give|name|identify)\\D{0,24}('+numberPattern+')','i')); const standalone=value.match(new RegExp('\\b('+numberPattern+')\\b','i')); const answer=count||standalone; if(!answer)return 1; return Math.max(1,Number(answer[1])||words[answer[1].toLowerCase()]||1); };
    const pastedQuestionStarts = text => String(text).replace(/\r/g,'').split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{ const match=line.match(/^(?:question\s*)?(\d+)\s*[.)\-:]/i); return match?Number(match[1]):null; }).filter(Boolean);
    const assignQuestionNumbers = (questions,starts=[]) => { let number=1; return questions.map((question,index)=>{ const expected=question.type==='enumeration'?(question.expectedItems||1):1; const pastedNumber=starts[index]||question.questionNumber; const start=Math.max(number,pastedNumber||number); const numbered={...question,questionNumber:pastedNumber||start,keyStart:start,keyEnd:start+expected-1}; number=start+expected; return numbered; }); };
    parsePastedQuestions = (text,type) => { const starts=pastedQuestionStarts(text); return assignQuestionNumbers(originalParsePastedQuestions(text,type).map(question=>{ const cleanText=String(question.text).trim().replace(/^['\"]+|['\"]+$/g,'').trim(); const isEnumeration=question.type==='enumeration'||/^\s*(?:enumerate|enumeration)\b/i.test(cleanText); if(!isEnumeration)return {...question,text:cleanText}; const range=cleanText.match(/\b(\d+)\s*(?:-|–|to)\s*(\d+)\b/i); return {...question,text:cleanText,type:'enumeration',expectedItems:range?Number(range[2])-Number(range[1])+1:enumerationItemCount(cleanText)}; }),starts); };
    const splitEnumerationAnswers = value => String(value??'').split(/[,;\n|]+/).map(item=>normalizeAnswer(item)).filter(Boolean);
    const enumerationAnswersMatch = (selected,answer,expectedItems=1) => { const selectedItems=[...new Set(splitEnumerationAnswers(selected))].sort(); const answerItems=[...new Set(splitEnumerationAnswers(answer))].sort(); return selectedItems.length===expectedItems&&answerItems.length===expectedItems&&selectedItems.every((item,index)=>item===answerItems[index]); };
    const questionNumberText = (question,index,total) => question.type==='enumeration'&&question.expectedItems>1 ? `QUESTION ${question.keyStart||index+1} · ITEMS ${question.keyStart||index+1}-${question.keyEnd||question.expectedItems}` : `QUESTION ${question.keyStart||index+1}`;
    function createQuiz(e) { e.preventDefault(); if(new Date(newStart.value)>=new Date(newEnd.value)){toast('End time must be later than start time');return;} const mode=document.getElementById('creationMode').value; const type=document.getElementById('questionType').value; const questions=mode==='auto'?generateQuestions(newLesson.value,type):parsePastedQuestions(questionPaste.value,type); if(!questions.length){toast(mode==='auto'?'Add more lesson details first':'Paste at least one numbered question first');return;} const user=JSON.parse(localStorage.getItem('quizly-user')); quizDraft={id:Date.now(),title:newTitle.value,subject:newSubject.value,description:newDescription.value,startAt:newStart.value,endAt:newEnd.value,teacherCode:user.teacherCode||localStorage.getItem('quizly-teacher-code')||'TEACH-2026',createdBy:user.uid||null,questionType:type,questions}; renderQuizPreview(); }

publishing</div><h1>${quizDraft.title}</h1><p>${quizDraft.description}</p><div class="panel"><div class="section-head"><h2>Review your test</h2><span class="label">${quizDraft.questions.length} question cards</span></div><p>${editMode?'Edit the question or answer on each card. Delete cards you do not need, or go back to the builder to generate more.':'Check every question and correct answer before publishing.'}</p>${cards||'<p>No questions remain. Add questions from the builder.</p>'}</div><div class="quiz-actions">${editMode?`<button class="btn alt" onclick="renderQuizPreview()">Done editing</button>`:`<button class="btn alt" onclick="renderQuizPreview(true)">Make changes</button>`}<button class="btn" onclick="publishDraft()" ${quizDraft.questions.length?'':'disabled'}>Publish quiz →</button></div></div></main>`; }

    async function publishDraft() { if(!quizDraft||!quizDraft.questions.length){toast('Add at least one question before publishing');return;} if(quizDraft.questions.some(q=>q.type!=='multiple'&&!String(q.options[q.answer]||'').trim())){toast('Type the correct answer for every card');return;} const user=JSON.parse(localStorage.getItem('quizly-user')); const isEdit=!!editingQuizId; quizDraft.id=isEdit?editingQuizId:Date.now(); quizDraft.teacherCode=quizDraft.teacherCode||user.teacherCode||localStorage.getItem('quizly-teacher-code')||'TEACH-2026'; quizDraft.createdBy=quizDraft.createdBy||user.uid||null; if(isEdit){const index=quizzes.findIndex(q=>q.id===editingQuizId); if(index>=0)quizzes[index]=quizDraft;}else quizzes.push(quizDraft); save(); try { await firestore.collection('quizzes').doc(String(quizDraft.id)).set(quizDraft); } catch(error) { console.warn('Quiz saved locally; Firestore update failed.',error); } toast(isEdit?'Quiz updated successfully':'Quiz published successfully'); quizDraft=null; quizInfoDraft=null; editingQuizId=null; renderShell('quizzes'); }

    function renderQuiz() { if(quizState(currentQuiz)!=='live'){toast('The quiz has ended and is no longer available');renderShell('quizzes');return;} const q=currentQuiz.questions[currentQuestion]; const endLabel=currentQuiz.endAt?new Date(currentQuiz.endAt).toLocaleString([], {dateStyle:'short',timeStyle:'short'}):'Open anytime'; const answerArea=q.type==='multiple'?`<div class="answers">${q.options.map((o,i)=>`<button class="answer ${selections[currentQuestion]===i?'selected':''}" onclick="choose(${i})">${o}</button>`).join('')}</div>`:`<input id="textAnswer" value="${selections[currentQuestion]||''}" placeholder="Type your answer here" oninput="selections[currentQuestion]=this.value">`; app.innerHTML=`<main><div class="quiz-layout"><button class="btn ghost" onclick="renderShell('quizzes')">← Back to quizzes</button><div class="eyebrow" style="margin-top:35px">${currentQuiz.subject} · Available until ${endLabel}</div><h1>${currentQuiz.title}</h1><div class="progress"><span style="width:${(currentQuestion/currentQuiz.questions.length)*100}%"></span></div><div class="question-card"><div class="question-number">${questionNumberText(q,currentQuestion,currentQuiz.questions.length)} · ${q.type==='multiple'?'MULTIPLE CHOICE':q.type==='identification'?'IDENTIFICATION':'ENUMERATION'}</div><h2>${q.text}</h2>${answerArea}</div><div class="quiz-actions"><span class="label">${selections.filter(x=>x!==undefined&&x!=='').length} answered</span><button class="btn ${selections[currentQuestion]===undefined||selections[currentQuestion]===''?'ghost':''}" onclick="nextQuestion()">${currentQuestion===currentQuiz.questions.length-1?'Submit quiz':'Next question →'}</button></div></div></main>`; }

      if(user?.role!=='Instructor')return html;
      return html.replace(/(<small>Quizzes completed<\/small><strong>)[^<]+/,`$1${completedQuizCount(user)}`);
    };
    const quizListWithUpdatedHeading = quizList;
    quizList = () => quizListWithUpdatedHeading().replace('Choose your challenge.','All quizzes you created.');
    const replaceGenerateCopy = () => {
      const content=document.getElementById('content');
      if(content)content.innerHTML=content.innerHTML.replace(/\bGenerate\b/g,'Create').replace(/\bgenerate\b/g,'create');
    };
    const builderWithCreateCopy=renderQuestionBuilder;
    renderQuestionBuilder=()=>{ builderWithCreateCopy(); replaceGenerateCopy(); };
    const answerKeyWithCreateCopy=generateAnswerKeyPage;
    generateAnswerKeyPage=()=>{ answerKeyWithCreateCopy(); replaceGenerateCopy(); };
    const quizCardWithCurrentRules=quizCard;
    quizCard=quiz=>{
      const user=JSON.parse(localStorage.getItem('quizly-user')||'null');
      const own=user?.role==='Student'&&records.some(record=>(record.email===user.email||record.student===user.name)&&record.quiz===quiz.title);
      const state=quizState(quiz);
      const card=quizCardWithCurrentRules(quiz).replace('class="quiz-card','class="quiz-card quiz-'+state);
      if(!own)return card;
      const safeTitle=String(quiz.title).replace(/'/g,"\\'");
      return card.replace(/onclick="startQuiz\(\d+\)"/,'onclick="showQuizRecords(\''+safeTitle+'\')"').replace(/>View answers</,'>View record</');
    };
    const quizCardWithEnabledRecord=quizCard;
    quizCard=quiz=>{
      const card=quizCardWithEnabledRecord(quiz);
      return card.includes('>View record</') ? card.replace('class="btn ghost" disabled','class="btn"') : card;
    };
    const endedOwnedQuizCount=user=>new Set(quizzes.filter(quiz=>quiz.teacherCode===user.teacherCode||quiz.createdBy===user.uid).filter(quiz=>quizState(quiz)==='ended').map(quiz=>quiz.title)).size;
    const dashboardWithEndedQuizCount=dashboard;
    dashboard=()=>{
      const user=JSON.parse(localStorage.getItem('quizly-user')||'null');
      const html=dashboardWithEndedQuizCount();
      const wrapper=document.createElement('div');
      wrapper.innerHTML=html;
      const cards=wrapper.querySelector('.grid');
      if(cards){
        const order={live:0,upcoming:1,unscheduled:1,ended:2};
        [...cards.children].sort((first,second)=>{
          const firstState=[...first.classList].find(name=>name.startsWith('quiz-')&&name!=='quiz-card')?.replace('quiz-','')||'ended';
          const secondState=[...second.classList].find(name=>name.startsWith('quiz-')&&name!=='quiz-card')?.replace('quiz-','')||'ended';
          return (order[firstState]??2)-(order[secondState]??2);
        }).forEach(card=>cards.appendChild(card));
      }
      const orderedHtml=wrapper.innerHTML;
      return user?.role==='Instructor'?orderedHtml.replace(/(<small>Quizzes completed<\/small><strong>)[^<]+/,`$1${endedOwnedQuizCount(user)}`):orderedHtml;
    };
    const studentQuizList=quizList;
    quizList=()=>{
      const user=JSON.parse(localStorage.getItem('quizly-user')||'null');
      if(user?.role!=='Student')return studentQuizList();
      const visible=quizzes.filter(quiz=>!isDemoQuiz(quiz)&&(quiz.teacherCode===user.teacherCode||quiz.createdBy===user.uid));
      const hasRecord=quiz=>records.some(record=>(record.email===user.email||record.student===user.name)&&record.quiz===quiz.title);
      const rank=quiz=>hasRecord(quiz)?3:quizState(quiz)==='live'?0:quizState(quiz)==='upcoming'||quizState(quiz)==='unscheduled'?1:2;
      const ordered=[...visible].sort((a,b)=>rank(a)-rank(b)||deadlineValue(a)-deadlineValue(b));
      return `<div class="eyebrow">Library</div><h1>All quizzes you created.</h1><p>Your teacher has published these assessments for your class.</p><div class="grid">${ordered.map(quizCard).join('')||'<p>No quizzes available yet.</p>'}</div>`;
    };
    const studentHistoryWithCleanAttemptCopy=studentRecordsView;
    studentRecordsView=()=>studentHistoryWithCleanAttemptCopy().replace(/(\d+) attempt(s?)( · Latest score)?/g,'Completed quiz$3').replace(/(<span class="label">)\d+ completed/,'$1Completed quizzes');
    const quizRenderWithReadableCounter=renderQuiz;
    renderQuiz=()=>{
      quizRenderWithReadableCounter();
      const card=document.querySelector('.question-card');
      if(!card||!currentQuiz)return;
      card.classList.add('quiz-taking');
      const title=document.querySelector('.quiz-layout > h1');
      if(title)title.textContent=formatQuizLabel(currentQuiz.title);
      document.querySelectorAll('.answer').forEach(answer=>answer.setAttribute('aria-pressed',answer.classList.contains('selected')?'true':'false'));
      const answered=currentQuiz.questions.reduce((total,question,index)=>{
        const value=selections[index];
        const hasAnswer=Array.isArray(value)?value.some(item=>String(item).trim()):String(value??'').trim()!=='';
        return total+(hasAnswer?1:0);
      },0);
      const counter=[...document.querySelectorAll('.quiz-nav .label, .quiz-layout > .label')].find(element=>/answered/i.test(element.textContent));
      if(counter)counter.className='quiz-answer-count';
      if(counter)counter.textContent=`Answered: ${answered} of ${currentQuiz.questions.length} questions`;
    };
    const previousWithSavedAnswer=previousQuestion;
    previousQuestion=()=>{
      const input=document.getElementById('textAnswer');
      if(input)selections[currentQuestion]=input.value;
      previousWithSavedAnswer();
    };
    clearExampleData();
    const savedUser=JSON.parse(localStorage.getItem('quizly-user')||'null');
    if(savedUser&&savedUser.email==='teacher@quizly.local') localStorage.removeItem('quizly-user');
    const activeUser=JSON.parse(localStorage.getItem('quizly-user')||'null');
    if(activeUser?.role==='Student'){ records=records.filter(record=>record.email===activeUser.email); save(); }
    if(activeUser) { renderShell(activeUser.role==='Student'?'quizzes':'dashboard'); startRecordsRealtimeSync(); startQuizzesRealtimeSync(); } else renderLogin();
  </script>
</body>
</html>
