<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Simple Bank System | C++ Project</title>
	<style>
		:root { --bg: #101d1c; --panel: #172a27; --line: #2b4943; --ink: #e8f3ee; --muted: #91aaa2; --teal: #70d2bd; --orange: #f29a6b; }
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--bg); font-family: Arial, sans-serif; }
		.shell { width: min(1180px, calc(100% - 36px)); margin: auto; }
		header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--line); }
		a { color: var(--teal); font-weight: bold; text-decoration: none; }
		main { padding: 55px 0 80px; }
		.eyebrow { color: var(--orange); font-size: 12px; font-weight: bold; letter-spacing: .14em; text-transform: uppercase; }
		h1 { margin: 14px 0 10px; font-size: clamp(2.5rem, 6vw, 5rem); }
		p { max-width: 680px; color: var(--muted); line-height: 1.7; }
		.panel { margin-top: 30px; border: 1px solid var(--line); background: var(--panel); }
		.panel-head, .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
		.code { width: 100%; min-height: 460px; padding: 20px; border: 0; outline: 0; resize: vertical; color: #bde8d9; background: #0b1514; font: 13px/1.6 Consolas, monospace; }
		.controls { flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 0; }
		button { padding: 11px 16px; color: #101d1c; background: var(--teal); border: 0; border-radius: 5px; font-weight: bold; cursor: pointer; }
		input { width: 100%; max-width: 300px; margin-left: 5px; padding: 9px; color: var(--ink); background: #0b1514; border: 1px solid var(--line); }
		pre { min-height: 180px; margin: 0; padding: 18px; overflow: auto; color: #bde8d9; background: #08100f; white-space: pre-wrap; }
		#input-row { display: none; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); color: var(--teal); background: #08100f; font-family: Consolas, monospace; }
		#input-row.visible { display: flex; }
		#input-row input { width: 100%; margin: 0; padding: 8px 0; color: var(--ink); background: transparent; border: 0; outline: 0; font: inherit; }
		@media (max-width: 650px) { header { gap: 15px; flex-wrap: wrap; } .shell { width: min(100% - 28px, 1180px); } }
	@media (max-width: 650px) { .panel-head, .controls { flex-wrap: wrap; align-items: flex-start; } .panel-head strong, .panel-head span, .controls span { max-width: 100%; overflow-wrap: anywhere; } .controls span { width: 100%; } .controls button { width: 100%; } .code { min-height: 300px; padding: 14px; font-size: 12px; } .terminal-input { padding: 10px 12px; } .terminal-input input { min-width: 0; } }
	</style>
</head>
<body>
	<header class="shell"><a href="cpp.html">← Back to C++ projects</a><strong>C++ COLLECTION</strong></header>
	<main class="shell">
		<div class="eyebrow">C++ project · C++17</div>
		<h1>Simple Bank System</h1>
		<p>Choose a deposit or withdrawal, enter the amount, and view the updated account balance.</p>
		<section class="panel">
			<div class="panel-head"><strong>simple-bank-system.cpp</strong><span>C++17</span></div>
			<textarea class="code" spellcheck="false">#include &lt;iostream&gt;
using namespace std;

int main() {
    double balance = 1000.00;
    int choice;
    double amount;
    cout &lt;&lt; "Welcome to Simple Bank System\n";
    cout &lt;&lt; "Initial Balance: " &lt;&lt; balance &lt;&lt; endl;
	cout &lt;&lt; "\nChoose transaction:\n1. Deposit\n2. Withdraw\n3. Exit\n";
    cout &lt;&lt; "Enter choice: ";
    cin &gt;&gt; choice;
    if (choice == 1) {
        cout &lt;&lt; "Enter amount to deposit: ";
        cin &gt;&gt; amount;
        balance += amount;
        cout &lt;&lt; "You deposited " &lt;&lt; amount &lt;&lt; endl;
        cout &lt;&lt; "New Balance: " &lt;&lt; balance &lt;&lt; endl;
    } else if (choice == 2) {
        cout &lt;&lt; "Enter amount to withdraw: ";
        cin &gt;&gt; amount;
        if (amount &lt;= balance) {
            balance -= amount;
            cout &lt;&lt; "You withdrew " &lt;&lt; amount &lt;&lt; endl;
            cout &lt;&lt; "Remaining Balance: " &lt;&lt; balance &lt;&lt; endl;
        } else {
            cout &lt;&lt; "Insufficient funds! Current Balance: " &lt;&lt; balance &lt;&lt; endl;
        }
    } else {
        cout &lt;&lt; "Invalid choice!" &lt;&lt; endl;
    }
    return 0;
}</textarea>
			<div class="controls"><span>Answer each prompt, pressing Enter after every input.</span><button id="run" type="button">Run C++</button></div>
			<pre id="output">Click Run C++ to start the program.</pre>
			<div id="input-row"><span>&gt;</span><input id="user-input" type="text" autocomplete="off" placeholder="Type your answer, then press Enter"></div>
		</section>
	</main>
	<script>
		const output = document.querySelector('#output');
		const inputRow = document.querySelector('#input-row');
		const input = document.querySelector('#user-input');
		let step = 'choice';
		let choice = 0;
		let balance = 1000;
		function showMenu() { step = 'choice'; output.textContent += '\nChoose transaction:\n1. Deposit\n2. Withdraw\n3. Exit\nEnter choice: '; input.value = ''; input.focus(); }
		function startProgram() { balance = 1000; output.textContent = 'Welcome to Simple Bank System\nInitial Balance: 1000\n'; inputRow.classList.add('visible'); showMenu(); }
		document.querySelector('#run').addEventListener('click', startProgram);
		input.addEventListener('keydown', event => {
			if (event.key !== 'Enter' || !input.value.trim()) return;
			const answer = input.value.trim();
			output.textContent += `${answer}\n`;
			input.value = '';
			if (step === 'choice') { choice = Number(answer); if (choice === 1) { step = 'deposit'; output.textContent += 'Enter amount to deposit: '; } else if (choice === 2) { step = 'withdraw'; output.textContent += 'Enter amount to withdraw: '; } else if (choice === 3) { output.textContent += 'Thank you for using Simple Bank System!\n'; inputRow.classList.remove('visible'); } else { output.textContent += 'Invalid choice! Please choose 1, 2, or 3.\n'; showMenu(); } return; }
			const amount = Number(answer);
			if (step === 'deposit') { balance += amount; output.textContent += `You deposited ${amount}\nNew Balance: ${balance}\n`; }
			if (step === 'withdraw') { output.textContent += amount <= balance ? `You withdrew ${amount}\nRemaining Balance: ${balance - amount}\n` : `Insufficient funds! Current Balance: ${balance}\n`; if (amount <= balance) balance -= amount; }
			showMenu();
		});
	</script>
</body>
</html>
